<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>God Killer</title>
<style>
:root{
  --bg:#0b0a17; --panel:#161428; --panel2:#120f20; --border:#2e2a4a;
  --violet:#8b5cf6; --violetDim:#6941b3; --gold:#e8c76f; --dp:#b39cf0;
  --text:#ece7fb; --sub:#9c93bd; --danger:#ff6b6b; --bar:#1c1832;
  --coin:#e0c078; --gem:#7fe0e6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  color:var(--text); font-family:'Trebuchet MS', system-ui, -apple-system, sans-serif;
  display:flex; justify-content:center; overflow:hidden;
  touch-action:manipulation;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(circle at 50% -8%, rgba(139,92,246,.16), transparent 55%),
             radial-gradient(circle at 50% 118%, rgba(232,199,111,.08), transparent 52%);
  pointer-events:none;z-index:-2;
}
#bgScene{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bgScene svg{position:absolute;bottom:0;left:0;width:100%;height:42%;opacity:.9}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#f2e6d8;opacity:.7;animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:1;transform:scale(1.7)}}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;padding:10px 12px;position:relative;overflow:hidden}
@keyframes flashPulse{0%{box-shadow:inset 0 0 0 rgba(232,199,111,0)}30%{box-shadow:inset 0 0 46px rgba(232,199,111,.32)}100%{box-shadow:inset 0 0 0 rgba(232,199,111,0)}}
@keyframes flashPulseStrong{0%{box-shadow:inset 0 0 0 rgba(232,199,111,0)}25%{box-shadow:inset 0 0 80px rgba(232,199,111,.5)}100%{box-shadow:inset 0 0 0 rgba(232,199,111,0)}}
.burstFlash{animation:flashPulse .5s ease}
.burstFlashStrong{animation:flashPulseStrong .85s ease}
h1{font-size:1.15rem;margin:0 0 2px;text-align:center;color:var(--gold);letter-spacing:1px;text-shadow:0 0 12px rgba(232,199,111,.35)}
.sub{text-align:center;color:var(--sub);font-size:.72rem;margin-bottom:8px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.statline{display:flex;justify-content:space-between;font-size:.82rem;margin:3px 0;color:var(--sub)}
.statline span{display:inline-flex;align-items:center;gap:4px}
.statline b{color:var(--text)}
.bar{height:12px;border-radius:6px;background:var(--bar);overflow:hidden;border:1px solid var(--border);position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--violetDim),var(--violet));transition:width .25s ease}
.qbar{position:relative;overflow:hidden}
.qbar::after{content:'';position:absolute;top:0;left:-60%;width:42%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:qshine 2.8s ease-in-out infinite;pointer-events:none}
@keyframes qshine{0%{left:-60%}55%{left:165%}100%{left:165%}}
#main{flex:1 1 auto;min-height:0;overflow-y:auto;padding-bottom:6px}
.realmRow{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 8px}
.realmName{font-size:1.05rem;color:var(--gold);text-align:center;font-weight:bold}
#trainZone{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px}
#coreWrap{position:relative;width:150px;height:150px;margin-bottom:10px}
#core{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;z-index:1;
  background:var(--panel2);
  box-shadow:0 0 30px 6px rgba(139,92,246,.45), inset 0 0 20px rgba(0,0,0,.35);
  border:2px solid var(--gold); cursor:pointer; user-select:none;
  transition:transform .12s cubic-bezier(.4,0,.2,1);
}
#core svg.heroArt{width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;z-index:2;pointer-events:none;width:100%;height:100%}
#core:active{transform:scale(.93)}
.fg{animation:fg .6s ease}
@keyframes fg{0%{box-shadow:0 0 0 0 #e8c76f00}40%{box-shadow:0 0 50px 8px #e8c76f}100%{box-shadow:0 0 30px 6px rgba(139,92,246,.45)}}
.float{position:absolute;left:50%;top:20%;transform:translateX(-50%);color:var(--gold);font-weight:bold;font-size:1rem;pointer-events:none;animation:floatUp 1s ease forwards;z-index:3}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-45px)}}
.btnRow{display:flex;gap:8px;margin-top:4px}
.b{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:.85rem;font-family:inherit;transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease;cursor:pointer}
.b:hover{box-shadow:0 4px 16px rgba(232,199,111,.22);border-color:#f0e0a8}
.b:active{transform:scale(.96)}
.b:disabled{opacity:.45;cursor:default;box-shadow:none}
.bPrimary{display:flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(180deg,var(--violet),var(--violetDim));border-color:var(--gold);color:#fff;font-weight:bold}
.tabs{display:flex;gap:6px;margin:8px 0}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 4px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--sub);font-size:.78rem;cursor:pointer}
.tab.active{background:var(--violet);color:#fff;border-color:var(--gold)}
.shopItem{display:flex;justify-content:space-between;align-items:center;padding:8px 6px;border-bottom:1px solid var(--border)}
.shopItem:last-child{border-bottom:none}
.shopName{font-size:.85rem;display:flex;align-items:center;gap:5px}
.shopDesc{font-size:.68rem;color:var(--sub)}
.buyBtn{display:inline-flex;align-items:center;gap:4px;padding:7px 10px;border-radius:8px;border:1px solid var(--gold);background:var(--panel2);color:var(--gold);font-size:.75rem;white-space:nowrap}
.buyBtn:disabled{opacity:.4;color:var(--sub);border-color:var(--border)}
.logBox{font-size:.72rem;color:var(--sub);max-height:70px;overflow-y:auto;border-top:1px solid var(--border);padding-top:6px}
.logBox div{margin:1px 0}
.coinTxt{color:var(--coin)}
.gemTxt{color:var(--gem)}
.ic{flex:none;display:inline-block;vertical-align:-2px}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--text);padding:8px 14px;border-radius:10px;font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:50}
#toast.show{opacity:1}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="icon-sword" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <line x1="4" y1="20" x2="19" y2="5"/>
        <line x1="14.5" y1="6" x2="17.5" y2="9"/>
        <circle cx="4" cy="20" r="1.3" fill="currentColor" stroke="none"/>
        <line x1="20" y1="20" x2="5" y2="5"/>
        <line x1="9.5" y1="6" x2="6.5" y2="9"/>
        <circle cx="20" cy="20" r="1.3" fill="currentColor" stroke="none"/>
      </g>
    </symbol>
    <symbol id="icon-coin" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".65"/>
    </symbol>
    <symbol id="icon-gem" viewBox="0 0 24 24">
      <path d="M6 4h12l4 6-10 10L2 10z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M6 4l3 6h6l3-6M9 10l3 10 3-10M2 10h20" fill="none" stroke="currentColor" stroke-width="1" opacity=".6"/>
    </symbol>
    <symbol id="icon-bolt" viewBox="0 0 24 24">
      <path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="icon-scroll" viewBox="0 0 24 24">
      <path d="M6 4h12v3a2 2 0 0 1 0 4v3a2 2 0 0 1 0 4v2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="7" y1="9" x2="14" y2="9" stroke="currentColor" stroke-width="1.1"/>
      <line x1="7" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.1"/>
    </symbol>
    <symbol id="icon-pouch" viewBox="0 0 24 24">
      <path d="M8 3h8l1 4H7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M6 7h12l1.5 9A3 3 0 0 1 16.5 20h-9A3 3 0 0 1 4.5 16z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-fist" viewBox="0 0 24 24">
      <path d="M7 10V7a2 2 0 0 1 4 0M11 10V6a2 2 0 0 1 4 0v4M15 10V7a2 2 0 0 1 4 0v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5v-2a2 2 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-disciple" viewBox="0 0 24 24">
      <circle cx="12" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M6 20c0-3.3 2.7-6 6-6s6 2.7 6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div id="bgScene" aria-hidden="true">
  <svg viewBox="0 0 480 200" preserveAspectRatio="xMidYMax slice">
    <path d="M0 160 L60 100 L100 140 L150 80 L200 130 L250 90 L300 150 L350 110 L400 150 L480 120 L480 200 L0 200 Z" fill="#120f20"/>
    <path d="M210 130 L230 90 L250 130 Z" fill="#1c1832"/>
    <rect x="221" y="130" width="18" height="20" fill="#1c1832"/>
    <line x1="230" y1="90" x2="230" y2="72" stroke="#1c1832" stroke-width="2"/>
  </svg>
  <span class="star" style="left:12%;top:18%;animation-delay:.2s"></span>
  <span class="star" style="left:28%;top:9%;animation-delay:1.1s"></span>
  <span class="star" style="left:47%;top:14%;animation-delay:.6s"></span>
  <span class="star" style="left:63%;top:7%;animation-delay:1.6s"></span>
  <span class="star" style="left:78%;top:16%;animation-delay:.9s"></span>
  <span class="star" style="left:88%;top:10%;animation-delay:.3s"></span>
</div>

<div id="app">
  <h1>God Killer</h1>
  <div class="sub">ปีนบันไดสวรรค์ ฆ่าเทพ ครองบัลลังก์เหนือทวยเทพ</div>

  <div class="panel">
    <div class="realmRow">
      <span id="realmSigil"></span>
      <span class="realmName" id="realmName">-</span>
    </div>
    <div class="statline"><span><svg class="ic" width="14" height="14" style="color:var(--dp)"><use href="#icon-bolt"></use></svg> พลังเทวะ (DP)</span><b id="qiTxt">0</b></div>
    <div class="bar qbar"><i id="qiBar" style="width:0%"></i></div>
    <div class="row" style="margin-top:6px">
      <div class="statline" style="margin:0"><span><svg class="ic" width="13" height="13" style="color:var(--coin)"><use href="#icon-coin"></use></svg> เหรียญศรัทธา</span> <b class="coinTxt" id="goldTxt">0</b></div>
      <div class="statline" style="margin:0"><span><svg class="ic" width="13" height="13" style="color:var(--gem)"><use href="#icon-gem"></use></svg> เศษแก่นเทพ</span> <b class="gemTxt" id="gemTxt">0</b></div>
    </div>
  </div>

  <div id="main">
    <div id="trainZone">
      <div id="coreWrap">
        <div id="core" role="button" tabindex="0" aria-label="แตะเพื่อบำเพ็ญ">
          <svg class="heroArt" viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <radialGradient id="haloGrad" cx="50%" cy="42%" r="55%">
                <stop offset="0%" stop-color="#fff3d0"/>
                <stop offset="35%" stop-color="#e8c76f"/>
                <stop offset="70%" stop-color="#8b5cf6" stop-opacity=".55"/>
                <stop offset="100%" stop-color="#2a1a5c" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#fff7e0"/>
                <stop offset="100%" stop-color="#e8c76f"/>
              </linearGradient>
            </defs>
            <circle cx="100" cy="100" r="92" fill="url(#haloGrad)"/>
            <g stroke="#f2e6d8" stroke-width="1.4" opacity=".55" fill="none">
              <circle cx="100" cy="78" r="46"/>
              <path d="M60 50 66 62M140 50 134 62M100 32 100 44"/>
            </g>
            <path d="M0 158 L40 118 L62 140 L92 104 L118 138 L146 112 L176 148 L200 132 L200 200 L0 200 Z" fill="#120f20" opacity=".85"/>
            <path d="M86 138 L100 112 L114 138 Z" fill="#1c1832"/>
            <rect x="93" y="138" width="14" height="16" fill="#1c1832"/>
            <line x1="100" y1="112" x2="100" y2="100" stroke="#1c1832" stroke-width="2"/>
            <g fill="#0b0a17">
              <path d="M100 150 C88 150 80 138 82 124 C84 112 92 104 100 96 C108 104 116 112 118 124 C120 138 112 150 100 150 Z"/>
              <circle cx="100" cy="86" r="10"/>
            </g>
            <line x1="100" y1="90" x2="132" y2="46" stroke="url(#bladeGrad)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>
            <line x1="118" y1="62" x2="126" y2="54" stroke="url(#bladeGrad)" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <canvas id="fx"></canvas>
      </div>
      <div style="font-size:.75rem;color:var(--sub);text-align:center">แตะแก่นพลังเพื่อบำเพ็ญ +<span id="clickPow">1</span> DP</div>
      <div style="font-size:.72rem;color:var(--sub);margin-top:2px">อัตโนมัติ: <span id="autoPow">0</span> DP/วิ</div>
      <button class="b bPrimary" id="breakthroughBtn" style="margin-top:12px;width:100%">
        <svg class="ic" width="16" height="16"><use href="#icon-sword"></use></svg>
        <span id="btLabel">突破 ทลายขีดจำกัด</span>
      </button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="train" role="button" tabindex="0"><svg class="ic" width="14" height="14"><use href="#icon-fist"></use></svg>บำเพ็ญ</div>
      <div class="tab" data-tab="shop" role="button" tabindex="0"><svg class="ic" width="14" height="14"><use href="#icon-pouch"></use></svg>ร้านค้า</div>
      <div class="tab" data-tab="log" role="button" tabindex="0"><svg class="ic" width="14" height="14"><use href="#icon-scroll"></use></svg>บันทึกศึก</div>
    </div>

    <div id="tab-shop" class="panel" style="display:none"></div>
    <div id="tab-log" class="panel logBox" style="display:none"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
"use strict";
const REALMS = [
  "มนุษย์ธรรมดา","ผู้ตื่นพลัง","นักพรตฝึกตน","ผู้เปิดทวารสวรรค์","เซียนจิ๋ว","เซียนแท้",
  "เทพชั้นรอง","เทพชั้นกลาง","เทพชั้นสูง","เทพประจำธาตุ","จอมเทพ",
  "ผู้ครองบัลลังก์สวรรค์","ผู้สังหารเทพ (ราชันเหนือทวยเทพ)"
];
const GODS = [
  "เทพสายฟ้า","เทพสงคราม","เทพมรณะ","เทพโชคชะตา","เทพทะเล",
  "เทพอัคคี","เทพกาลเวลา","เทพจันทรา","เทพสุริยัน","เทพเจ้าสูงสุด"
];
const REALM_BASE = 50;
const REALM_GROWTH = 1.55;
const SAVE_KEY = 'godKillerSave';

let state = {
  qi:0, gold:0, gems:0,
  realm:0,
  clickBase:1,
  autoBase:0,
  upgrades:{ fist:0, root:0, sword:0, manual:0, disciple:0 },
  godsSlain:0,
  lastSave: Date.now(),
  totalBreakthroughs:0,
  log:[]
};

const UPG = {
  fist:   { name:"ปลุกพลังในตน",   desc:"+1 DP ต่อแตะ",        base:10,  grow:1.16, effect:"click", amt:1, icon:"icon-fist" },
  root:   { name:"แท่นบูชาเทวะ",   desc:"+1 DP/วิ อัตโนมัติ",   base:25,  grow:1.18, effect:"auto",  amt:1, icon:"icon-bolt" },
  sword:  { name:"พรสวรรค์",       desc:"+3 DP ต่อแตะ",        base:150, grow:1.20, effect:"click", amt:3, icon:"icon-sword" },
  manual: { name:"คัมภีร์ต้องห้าม", desc:"+5 DP/วิ อัตโนมัติ",   base:400, grow:1.22, effect:"auto",  amt:5, icon:"icon-scroll" },
  disciple:{name:"ผู้ติดตามศรัทธา", desc:"+15 DP/วิ อัตโนมัติ",  base:2000,grow:1.25, effect:"auto",  amt:15, icon:"icon-disciple" }
};

let fx = null;

function realmThreshold(i){ return Math.floor(REALM_BASE * Math.pow(REALM_GROWTH, i)); }
function realmName(i){ return REALMS[Math.min(i, REALMS.length-1)] + (i>=REALMS.length ? " ("+(i-REALMS.length+2)+"ชั้น)" : ""); }
function godForKill(n){ return GODS[(n-1) % GODS.length]; }

function clickPower(){ return state.clickBase + state.upgrades.fist*UPG.fist.amt + state.upgrades.sword*UPG.sword.amt; }
function autoPower(){ return state.autoBase + state.upgrades.root*UPG.root.amt + state.upgrades.manual*UPG.manual.amt + state.upgrades.disciple*UPG.disciple.amt; }
function upgCost(key){ const u = UPG[key]; return Math.floor(u.base * Math.pow(u.grow, state.upgrades[key])); }

function fmt(n){
  if(n < 1000) return Math.floor(n).toString();
  const units = ["K","M","B","T","Qa","Qi"];
  let u = -1;
  while(n >= 1000 && u < units.length-1){ n/=1000; u++; }
  return n.toFixed(2) + units[u];
}

function sigilSVG(i){
  const tier = i>=10 ? 3 : i>=7 ? 2 : i>=4 ? 1 : 0;
  const c = 'var(--gold)';
  let inner = '';
  if(tier===0){
    inner = `<circle cx="18" cy="18" r="13" fill="none" stroke="${c}" stroke-width="1.6"/>`;
  } else if(tier===1){
    inner = `<circle cx="18" cy="18" r="14" fill="none" stroke="${c}" stroke-width="1.4"/>
      <circle cx="18" cy="18" r="9" fill="none" stroke="${c}" stroke-width="1" opacity=".7"/>
      <circle cx="18" cy="4" r="1.3" fill="${c}"/><circle cx="18" cy="32" r="1.3" fill="${c}"/>
      <circle cx="4" cy="18" r="1.3" fill="${c}"/><circle cx="32" cy="18" r="1.3" fill="${c}"/>`;
  } else if(tier===2){
    inner = `<circle cx="18" cy="18" r="15" fill="none" stroke="${c}" stroke-width="1.4"/>
      <circle cx="18" cy="18" r="9" fill="none" stroke="${c}" stroke-width="1" opacity=".7"/>
      <g stroke="${c}" stroke-width="1.1">
        <line x1="18" y1="1" x2="18" y2="7"/><line x1="18" y1="29" x2="18" y2="35"/>
        <line x1="1" y1="18" x2="7" y2="18"/><line x1="29" y1="18" x2="35" y2="18"/>
        <line x1="6" y1="6" x2="10" y2="10"/><line x1="26" y1="26" x2="30" y2="30"/>
        <line x1="30" y1="6" x2="26" y2="10"/><line x1="10" y1="26" x2="6" y2="30"/>
      </g>
      <circle cx="18" cy="18" r="3" fill="${c}" filter="url(#softGlow)"/>`;
  } else {
    inner = `<circle cx="18" cy="18" r="15" fill="none" stroke="${c}" stroke-width="1.6"/>
      <circle cx="18" cy="18" r="9" fill="none" stroke="${c}" stroke-width="1" opacity=".7"/>
      <g stroke="${c}" stroke-width="1.1">
        <line x1="18" y1="0" x2="18" y2="7"/><line x1="18" y1="29" x2="18" y2="36"/>
        <line x1="0" y1="18" x2="7" y2="18"/><line x1="29" y1="18" x2="36" y2="18"/>
        <line x1="5" y1="5" x2="10" y2="10"/><line x1="26" y1="26" x2="31" y2="31"/>
        <line x1="31" y1="5" x2="26" y2="10"/><line x1="10" y1="26" x2="5" y2="31"/>
      </g>
      <path d="M13 9 L18 2 L23 9 Z" fill="${c}"/>
      <circle cx="18" cy="18" r="3.4" fill="${c}" filter="url(#softGlow)"/>`;
  }
  return `<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">${inner}</svg>`;
}

function addLog(msg){
  state.log.unshift("["+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+"] "+msg);
  if(state.log.length>40) state.log.length=40;
  renderLog();
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 1600);
}

function flashScreen(strong){
  const app = document.getElementById('app');
  app.classList.remove('burstFlash','burstFlashStrong');
  void app.offsetWidth;
  app.classList.add(strong ? 'burstFlashStrong' : 'burstFlash');
}

function render(){
  const need = realmThreshold(state.realm);
  document.getElementById('realmName').textContent = realmName(state.realm);
  document.getElementById('realmSigil').innerHTML = sigilSVG(state.realm);
  document.getElementById('qiTxt').textContent = fmt(state.qi)+" / "+fmt(need);
  document.getElementById('qiBar').style.width = Math.min(100, state.qi/need*100)+"%";
  document.getElementById('goldTxt').textContent = fmt(state.gold);
  document.getElementById('gemTxt').textContent = fmt(state.gems);
  document.getElementById('clickPow').textContent = fmt(clickPower());
  document.getElementById('autoPow').textContent = fmt(autoPower());
  const btBtn = document.getElementById('breakthroughBtn');
  const ready = state.qi >= need;
  btBtn.disabled = !ready;
  document.getElementById('btLabel').textContent = ready ? "突破 ทลายขีดจำกัด!" : "突破 ทลายขีดจำกัด (ต้องการ DP เพิ่ม)";
  renderShop();
}

function renderShop(){
  const box = document.getElementById('tab-shop');
  box.innerHTML = '';
  Object.keys(UPG).forEach(key=>{
    const u = UPG[key];
    const cost = upgCost(key);
    const lvl = state.upgrades[key];
    const div = document.createElement('div');
    div.className = 'shopItem';
    div.innerHTML = `
      <div>
        <div class="shopName"><svg class="ic" width="15" height="15"><use href="#${u.icon}"></use></svg>${u.name} <span style="color:var(--sub)">Lv.${lvl}</span></div>
        <div class="shopDesc">${u.desc}</div>
      </div>
      <button class="buyBtn" ${state.gold < cost ? 'disabled' : ''}><svg class="ic" width="12" height="12"><use href="#icon-coin"></use></svg>${fmt(cost)} เหรียญ</button>
    `;
    div.querySelector('button').addEventListener('click', ()=>buyUpgrade(key));
    box.appendChild(div);
  });
}

function renderLog(){
  const box = document.getElementById('tab-log');
  box.innerHTML = state.log.map(l=>`<div>${l}</div>`).join('') || '<div>ยังไม่มีบันทึก</div>';
}

function buyUpgrade(key){
  const cost = upgCost(key);
  if(state.gold < cost) return;
  state.gold -= cost;
  state.upgrades[key]++;
  addLog(`เสริมพลัง: ${UPG[key].name} เป็น Lv.${state.upgrades[key]}`);
  render();
  save();
}

function train(e){
  const pow = clickPower();
  state.qi += pow;
  const core = document.getElementById('core');
  core.classList.remove('fg'); void core.offsetWidth; core.classList.add('fg');
  const f = document.createElement('div');
  f.className='float';
  f.textContent = '+'+fmt(pow);
  document.getElementById('coreWrap').appendChild(f);
  setTimeout(()=>f.remove(), 1000);
  if(fx){
    const rect = document.getElementById('fx').getBoundingClientRect();
    let x = rect.width/2, y = rect.height/2;
    if(e && typeof e.clientX === 'number' && e.clientX){ x = e.clientX - rect.left; y = e.clientY - rect.top; }
    fx.tapBurst(x, y);
  }
  render();
}

function breakthrough(){
  const need = realmThreshold(state.realm);
  if(state.qi < need) return;
  state.qi -= need;
  state.realm++;
  state.totalBreakthroughs++;
  const goldReward = Math.floor(need*0.6) + state.realm*8;
  state.gold += goldReward;

  const rect = document.getElementById('fx') ? document.getElementById('fx').getBoundingClientRect() : null;

  if(state.realm % 3 === 0){
    state.godsSlain++;
    const god = godForKill(state.godsSlain);
    const gemReward = 1 + Math.floor(state.realm/6);
    state.gems += gemReward;
    addLog(`ทลายขีดจำกัดสำเร็จ! สังหาร "${god}" ได้เศษแก่นเทพ ${gemReward} และเหรียญศรัทธา ${fmt(goldReward)}`);
    toast('⚔ สังหาร '+god+' สำเร็จ!');
    if(fx && rect){ fx.breakBurst(rect.width/2, rect.height/2, true); }
    flashScreen(true);
  } else {
    addLog(`ทลายขีดจำกัดสำเร็จ! ก้าวสู่ "${realmName(state.realm)}" ได้เหรียญศรัทธา ${fmt(goldReward)}`);
    toast('突破成功！ ก้าวสู่ '+realmName(state.realm));
    if(fx && rect){ fx.breakBurst(rect.width/2, rect.height/2, false); }
    flashScreen(false);
  }
  render();
  save();
}

function tick(){
  const auto = autoPower();
  if(auto>0){ state.qi += auto/10; render(); }
}

function save(){
  state.lastSave = Date.now();
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}

function load(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw) return;
  try{
    const loaded = JSON.parse(raw);
    state = Object.assign(state, loaded);
    state.upgrades = Object.assign({fist:0,root:0,sword:0,manual:0,disciple:0}, loaded.upgrades||{});
    const offlineSec = Math.max(0, Math.floor((Date.now() - (loaded.lastSave||Date.now()))/1000));
    if(offlineSec > 5){
      const auto = autoPower();
      const gained = Math.min(offlineSec, 8*3600) * auto;
      if(gained > 0){
        state.qi += gained;
        addLog(`ขณะไม่อยู่ (${Math.floor(offlineSec/60)} นาที) บำเพ็ญอัตโนมัติได้ ${fmt(gained)} DP`);
      }
    }
  }catch(e){}
}

function initTabs(){
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(t=>{
    t.addEventListener('click', ()=>{
      tabs.forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      const name = t.dataset.tab;
      document.getElementById('trainZone').style.display = name==='train' ? 'flex' : 'none';
      document.getElementById('breakthroughBtn').style.display = name==='train' ? 'flex' : 'none';
      document.getElementById('tab-shop').style.display = name==='shop' ? 'block' : 'none';
      document.getElementById('tab-log').style.display = name==='log' ? 'block' : 'none';
    });
  });
}

function initFX(canvas){
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio||1, 2);
  function resize(){
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, r.width*DPR);
    canvas.height = Math.max(1, r.height*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let particles = [];
  const W = ()=>canvas.getBoundingClientRect().width;
  const H = ()=>canvas.getBoundingClientRect().height;

  function spawnAmbient(){
    const w=W(), h=H();
    particles.push({
      x: Math.random()*w, y: h+4, vx:(Math.random()-.5)*6, vy:-(18+Math.random()*22),
      r: 1+Math.random()*1.8, life:0, maxLife: 2.4+Math.random()*1.8,
      color: Math.random()<.5 ? '230,199,111' : '179,156,240', kind:'ambient'
    });
  }
  function burst(x,y,count,strong){
    for(let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const spd = strong ? 60+Math.random()*90 : 30+Math.random()*40;
      particles.push({
        x, y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd,
        r: strong ? 1.6+Math.random()*2.4 : 1+Math.random()*1.6,
        life:0, maxLife: strong ? 0.7+Math.random()*0.5 : 0.4+Math.random()*0.35,
        color: strong ? '232,199,111' : '236,231,251', kind:'burst'
      });
    }
  }

  let last = performance.now(), acc = 0;
  function frame(now){
    const dt = Math.min(.05, (now-last)/1000); last = now;
    const w=W(), h=H();
    ctx.clearRect(0,0,w,h);
    if(!reduced){
      acc += dt;
      if(acc > 0.28){ acc = 0; spawnAmbient(); }
    }
    particles = particles.filter(p=>{
      p.life += dt;
      if(p.life >= p.maxLife) return false;
      p.x += p.vx*dt; p.y += p.vy*dt;
      if(p.kind==='burst'){ p.vx *= (1-2.2*dt); p.vy *= (1-2.2*dt); }
      const t = 1 - p.life/p.maxLife;
      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.color},${Math.max(0,(t*0.85)).toFixed(2)})`;
      ctx.arc(p.x, p.y, p.r*(p.kind==='burst'? t+0.3:1), 0, Math.PI*2);
      ctx.fill();
      return true;
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return {
    tapBurst(x,y){ burst(x,y, 8, false); },
    breakBurst(x,y,strong){ burst(x,y, strong?26:14, !!strong); }
  };
}

document.getElementById('core').addEventListener('click', train);
document.getElementById('core').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); train(); } });
document.getElementById('breakthroughBtn').addEventListener('click', breakthrough);
initTabs();
fx = initFX(document.getElementById('fx'));
load();
render();
if(state.log.length===0) addLog('เริ่มต้นเส้นทางสังหารเทพ ขอให้พลังเทวะสถิตกับท่าน!');
renderLog();

setInterval(tick, 1000);
setInterval(save, 10000);
window.addEventListener('beforeunload', save);
})();
</script>
</body>
