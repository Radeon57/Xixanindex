<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>จอมยุทธ์บุกเบิก</title>
<style>
:root{
  --bg:#140b0a; --panel:#1d1210; --panel2:#170e0c; --border:#3a221c;
  --red:#d84b3a; --redDim:#a63b2d; --gold:#e0b054; --qi:#e6c07f;
  --text:#f2e6d8; --sub:#b39485; --danger:#ff6b5b; --bar:#241512;
  --hp:#d56a6a; --crit:#ffb23c; --coin:#e0c078; --gem:#c9a8ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  color:var(--text); font-family:'Trebuchet MS', system-ui, -apple-system, sans-serif;
  display:flex; justify-content:center; overflow:hidden;
  touch-action:manipulation;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(circle at 50% -8%, rgba(216,75,58,.12), transparent 55%),
             radial-gradient(circle at 50% 118%, rgba(224,176,84,.08), transparent 52%);
  pointer-events:none;z-index:-1;
}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;padding:10px 12px;position:relative;overflow:hidden}
h1{font-size:1.15rem;margin:0 0 2px;text-align:center;color:var(--gold);letter-spacing:1px;text-shadow:0 0 12px rgba(224,176,84,.35)}
.sub{text-align:center;color:var(--sub);font-size:.72rem;margin-bottom:8px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.statline{display:flex;justify-content:space-between;font-size:.82rem;margin:3px 0;color:var(--sub)}
.statline b{color:var(--text)}
.bar{height:12px;border-radius:6px;background:var(--bar);overflow:hidden;border:1px solid var(--border);position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--redDim),var(--red));transition:width .25s ease}
.qbar{position:relative;overflow:hidden}
.qbar::after{content:'';position:absolute;top:0;left:-60%;width:42%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:qshine 2.8s ease-in-out infinite;pointer-events:none}
@keyframes qshine{0%{left:-60%}55%{left:165%}100%{left:165%}}
#main{flex:1 1 auto;min-height:0;overflow-y:auto;padding-bottom:6px}
.realmName{font-size:1.05rem;color:var(--gold);text-align:center;margin:4px 0 8px;font-weight:bold}
#trainZone{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px}
#coreWrap{position:relative;width:150px;height:150px;margin-bottom:10px}
#core{width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #ffdca0, var(--red) 55%, #5c1e16 100%);
  box-shadow:0 0 30px 6px rgba(216,75,58,.45), inset 0 0 20px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;font-size:2.4rem;
  border:2px solid var(--gold); cursor:pointer; user-select:none;
  transition:transform .12s cubic-bezier(.4,0,.2,1);
}
#core:active{transform:scale(.93)}
.ring{position:absolute;inset:-10px;border-radius:50%;border:2px dashed rgba(224,176,84,.4);animation:spin 10s linear infinite;pointer-events:none}
.ring2{position:absolute;inset:-20px;border-radius:50%;border:1px solid rgba(230,192,127,.25);animation:spin2 16s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin2{to{transform:rotate(-360deg)}}
.fg{animation:fg .6s ease}
@keyframes fg{0%{box-shadow:0 0 0 0 #e0b05400}40%{box-shadow:0 0 50px 8px #e0b054}100%{box-shadow:0 0 30px 6px rgba(216,75,58,.45)}}
.float{position:absolute;left:50%;top:20%;transform:translateX(-50%);color:var(--gold);font-weight:bold;font-size:1rem;pointer-events:none;animation:floatUp 1s ease forwards}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-45px)}}
.btnRow{display:flex;gap:8px;margin-top:4px}
.b{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:.85rem;font-family:inherit;transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease;cursor:pointer}
.b:hover{box-shadow:0 4px 16px rgba(224,176,84,.22);border-color:#f0d9a8}
.b:active{transform:scale(.96)}
.b:disabled{opacity:.45;cursor:default;box-shadow:none}
.bPrimary{background:linear-gradient(180deg,var(--red),var(--redDim));border-color:var(--gold);color:#fff;font-weight:bold}
.tabs{display:flex;gap:6px;margin:8px 0}
.tab{flex:1;text-align:center;padding:7px 4px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--sub);font-size:.78rem;cursor:pointer}
.tab.active{background:var(--red);color:#fff;border-color:var(--gold)}
.shopItem{display:flex;justify-content:space-between;align-items:center;padding:8px 6px;border-bottom:1px solid var(--border)}
.shopItem:last-child{border-bottom:none}
.shopName{font-size:.85rem}
.shopDesc{font-size:.68rem;color:var(--sub)}
.buyBtn{padding:7px 10px;border-radius:8px;border:1px solid var(--gold);background:var(--panel2);color:var(--gold);font-size:.75rem;white-space:nowrap}
.buyBtn:disabled{opacity:.4;color:var(--sub);border-color:var(--border)}
.logBox{font-size:.72rem;color:var(--sub);max-height:70px;overflow-y:auto;border-top:1px solid var(--border);padding-top:6px}
.logBox div{margin:1px 0}
.coinTxt{color:var(--coin)}
.gemTxt{color:var(--gem)}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--text);padding:8px 14px;border-radius:10px;font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:50}
#toast.show{opacity:1}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <h1>จอมยุทธ์บุกเบิก</h1>
  <div class="sub">ฝึกฝนพลังภายใน ก้าวข้ามทุกด่านสู่ยุทธจักร</div>

  <div class="panel">
    <div class="realmName" id="realmName">-</div>
    <div class="statline"><span>พลังภายใน (Qi)</span><b id="qiTxt">0</b></div>
    <div class="bar qbar"><i id="qiBar" style="width:0%"></i></div>
    <div class="row" style="margin-top:6px">
      <div class="statline" style="margin:0"><span>เงิน</span> <b class="coinTxt" id="goldTxt">0</b></div>
      <div class="statline" style="margin:0"><span>อัญมณี</span> <b class="gemTxt" id="gemTxt">0</b></div>
    </div>
  </div>

  <div id="main">
    <div id="trainZone">
      <div id="coreWrap">
        <div class="ring2"></div>
        <div class="ring"></div>
        <div id="core">☯</div>
      </div>
      <div style="font-size:.75rem;color:var(--sub);text-align:center">แตะดวงแก่นเพื่อฝึกวรยุทธ์ +<span id="clickPow">1</span> Qi</div>
      <div style="font-size:.72rem;color:var(--sub);margin-top:2px">อัตโนมัติ: <span id="autoPow">0</span> Qi/วิ</div>
      <button class="b bPrimary" id="breakthroughBtn" style="margin-top:12px;width:100%">突破 ทลายด่าน</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="train">ฝึกฝน</div>
      <div class="tab" data-tab="shop">ร้านค้า</div>
      <div class="tab" data-tab="log">บันทึก</div>
    </div>

    <div id="tab-shop" class="panel" style="display:none"></div>
    <div id="tab-log" class="panel logBox" style="display:none"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
"use strict";
const REALMS = [
  "ฝึกกาย","ผูกเส้นลมปราณ","เปิดต้นทาง","สามทวารเปิด","กระบี่ปฐมภูมิ",
  "จอมยุทธ์ชั้นนอก","จอมยุทธ์ชั้นใน","เจ้าสำนักลำดับต้น","ผู้ยิ่งใหญ่แห่งยุทธจักร",
  "เทพกระบี่","ผู้ครองยุทธภพ","ตำนานเหนือกาล"
];
const REALM_BASE = 50;
const REALM_GROWTH = 1.55;

let state = {
  qi:0, gold:0, gems:0,
  realm:0,
  clickBase:1,
  autoBase:0,
  upgrades:{ fist:0, root:0, sword:0, manual:0, disciple:0 },
  lastSave: Date.now(),
  totalBreakthroughs:0,
  log:[]
};

const UPG = {
  fist:   { name:"หมัดเหล็ก",      desc:"+1 Qi ต่อแตะ",        base:10,  grow:1.16, effect:"click", amt:1 },
  root:   { name:"รากปราณ",       desc:"+1 Qi/วิ อัตโนมัติ",    base:25,  grow:1.18, effect:"auto",  amt:1 },
  sword:  { name:"กระบี่วิถี",     desc:"+3 Qi ต่อแตะ",        base:150, grow:1.20, effect:"click", amt:3 },
  manual: { name:"คัมภีร์ลับ",     desc:"+5 Qi/วิ อัตโนมัติ",    base:400, grow:1.22, effect:"auto",  amt:5 },
  disciple:{name:"ศิษย์ผู้ช่วย",   desc:"+15 Qi/วิ อัตโนมัติ",   base:2000,grow:1.25, effect:"auto",  amt:15 }
};

function realmThreshold(i){ return Math.floor(REALM_BASE * Math.pow(REALM_GROWTH, i)); }
function realmName(i){ return REALMS[Math.min(i, REALMS.length-1)] + (i>=REALMS.length ? " ("+(i-REALMS.length+2)+"ชั้น)" : ""); }

function clickPower(){ return state.clickBase + state.upgrades.fist*UPG.fist.amt + state.upgrades.sword*UPG.sword.amt; }
function autoPower(){ return state.autoBase + state.upgrades.root*UPG.root.amt + state.upgrades.manual*UPG.manual.amt + state.upgrades.disciple*UPG.disciple.amt; }
function upgCost(key){ const u = UPG[key]; return Math.floor(u.base * Math.pow(u.grow, state.upgrades[key])); }

function fmt(n){
  if(n < 1000) return Math.floor(n).toString();
  const units = ["K","M","B","T","Qa","Qi"];
  let u = -1;
  while(n >= 1000 && u < units.length-1){ n/=1000; u++; }
  return n.toFixed(2) + units[u];
}

function addLog(msg){
  state.log.unshift("["+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+"] "+msg);
  if(state.log.length>40) state.log.length=40;
  renderLog();
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 1600);
}

function render(){
  const need = realmThreshold(state.realm);
  document.getElementById('realmName').textContent = realmName(state.realm);
  document.getElementById('qiTxt').textContent = fmt(state.qi)+" / "+fmt(need);
  document.getElementById('qiBar').style.width = Math.min(100, state.qi/need*100)+"%";
  document.getElementById('goldTxt').textContent = fmt(state.gold);
  document.getElementById('gemTxt').textContent = fmt(state.gems);
  document.getElementById('clickPow').textContent = fmt(clickPower());
  document.getElementById('autoPow').textContent = fmt(autoPower());
  const btBtn = document.getElementById('breakthroughBtn');
  const ready = state.qi >= need;
  btBtn.disabled = !ready;
  btBtn.textContent = ready ? "突破 ทลายด่าน!" : "突破 ทลายด่าน (ต้องการ Qi เพิ่ม)";
  renderShop();
}

function renderShop(){
  const box = document.getElementById('tab-shop');
  box.innerHTML = '';
  Object.keys(UPG).forEach(key=>{
    const u = UPG[key];
    const cost = upgCost(key);
    const lvl = state.upgrades[key];
    const div = document.createElement('div');
    div.className = 'shopItem';
    div.innerHTML = `
      <div>
        <div class="shopName">${u.name} <span style="color:var(--sub)">Lv.${lvl}</span></div>
        <div class="shopDesc">${u.desc}</div>
      </div>
      <button class="buyBtn" ${state.gold < cost ? 'disabled' : ''}>${fmt(cost)} เงิน</button>
    `;
    div.querySelector('button').addEventListener('click', ()=>buyUpgrade(key));
    box.appendChild(div);
  });
}

function renderLog(){
  const box = document.getElementById('tab-log');
  box.innerHTML = state.log.map(l=>`<div>${l}</div>`).join('') || '<div>ยังไม่มีบันทึก</div>';
}

function buyUpgrade(key){
  const cost = upgCost(key);
  if(state.gold < cost) return;
  state.gold -= cost;
  state.upgrades[key]++;
  addLog(`เสริมพลัง: ${UPG[key].name} เป็น Lv.${state.upgrades[key]}`);
  render();
  save();
}

function train(){
  const pow = clickPower();
  state.qi += pow;
  const core = document.getElementById('core');
  core.classList.remove('fg'); void core.offsetWidth; core.classList.add('fg');
  const f = document.createElement('div');
  f.className='float';
  f.textContent = '+'+fmt(pow);
  document.getElementById('coreWrap').appendChild(f);
  setTimeout(()=>f.remove(), 1000);
  render();
}

function breakthrough(){
  const need = realmThreshold(state.realm);
  if(state.qi < need) return;
  state.qi -= need;
  state.realm++;
  state.totalBreakthroughs++;
  const goldReward = Math.floor(need*0.6) + state.realm*8;
  state.gold += goldReward;
  let gemReward = 0;
  if(state.realm % 3 === 0){ gemReward = 1 + Math.floor(state.realm/6); state.gems += gemReward; }
  addLog(`ทลายด่านสำเร็จ! ก้าวสู่ "${realmName(state.realm)}" ได้เงิน ${fmt(goldReward)}${gemReward?` และอัญมณี ${gemReward}`:''}`);
  toast('突破成功！ ก้าวสู่ '+realmName(state.realm));
  render();
  save();
}

function tick(){
  const auto = autoPower();
  if(auto>0){ state.qi += auto/10; render(); }
}

function save(){
  state.lastSave = Date.now();
  localStorage.setItem('wuxiaIdleSave', JSON.stringify(state));
}

function load(){
  const raw = localStorage.getItem('wuxiaIdleSave');
  if(!raw) return;
  try{
    const loaded = JSON.parse(raw);
    state = Object.assign(state, loaded);
    state.upgrades = Object.assign({fist:0,root:0,sword:0,manual:0,disciple:0}, loaded.upgrades||{});
    const offlineSec = Math.max(0, Math.floor((Date.now() - (loaded.lastSave||Date.now()))/1000));
    if(offlineSec > 5){
      const auto = autoPower();
      const gained = Math.min(offlineSec, 8*3600) * auto;
      if(gained > 0){
        state.qi += gained;
        addLog(`ขณะไม่อยู่ (${Math.floor(offlineSec/60)} นาที) ฝึกฝนอัตโนมัติได้ ${fmt(gained)} Qi`);
      }
    }
  }catch(e){}
}

function initTabs(){
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(t=>{
    t.addEventListener('click', ()=>{
      tabs.forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      const name = t.dataset.tab;
      document.getElementById('trainZone').style.display = name==='train' ? 'flex' : 'none';
      document.getElementById('breakthroughBtn').style.display = name==='train' ? 'block' : 'none';
      document.getElementById('tab-shop').style.display = name==='shop' ? 'block' : 'none';
      document.getElementById('tab-log').style.display = name==='log' ? 'block' : 'none';
    });
  });
}

document.getElementById('core').addEventListener('click', train);
document.getElementById('breakthroughBtn').addEventListener('click', breakthrough);
initTabs();
load();
render();
if(state.log.length===0) addLog('เริ่มต้นเส้นทางสู่ยุทธจักร ขอให้โชคดี!');
renderLog();

setInterval(tick, 1000);
setInterval(save, 10000);
window.addEventListener('beforeunload', save);
})();
</script>
</body>
</html>
