<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>หนทางบำเพ็ญเซียน</title>
<style>
:root{
  --bg:#0a0e0c; --panel:#111a15; --panel2:#0d1410; --border:#22302a;
  --gold:#d8b65a; --goldDim:#a6904a; --jade:#6fc0a0; --qi:#7fd6e6;
  --text:#e8e2d2; --sub:#93a297; --danger:#d9756a; --bar:#16221c;
  --hp:#d56a6a; --crit:#ff9a3c; --coin:#8fd0c8; --gem:#b3a8ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  color:var(--text); font-family:'Trebuchet MS', system-ui, -apple-system, sans-serif;
  display:flex; justify-content:center; overflow:hidden;
  touch-action:manipulation;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(circle at 50% -8%, rgba(111,192,160,.10), transparent 55%),
             radial-gradient(circle at 50% 118%, rgba(216,182,90,.07), transparent 52%);
  pointer-events:none;z-index:-1;
}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;padding:8px 12px;position:relative;overflow:hidden}
#shell{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;width:100%}
#mist{position:absolute;inset:0;opacity:.06;background:radial-gradient(circle at 50% 0%, var(--jade), transparent 60%);animation:mist 12s ease-in-out infinite alternate;pointer-events:none;will-change:transform}
@keyframes mist{0%{transform:translateX(-8%)}100%{transform:translateX(8%)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.fg{animation:fg .6s ease}.fb{animation:fb .5s ease}
@keyframes fg{0%{box-shadow:0 0 0 0 #d8b65a00}40%{box-shadow:0 0 50px 6px #d8b65a}100%{box-shadow:0 0 0 0 #d8b65a00}}
@keyframes fb{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.b{transition:transform .15s cubic-bezier(.4,0,.2,1),box-shadow .2s ease,border-color .2s ease;font-family:inherit;border:1px solid transparent}
.b:hover{box-shadow:0 4px 16px rgba(216,182,90,.22);border-color:#f0d9a8}
.b:active{transform:scale(.97)}
.b:disabled{opacity:.6;cursor:default}
.qbar{position:relative;overflow:hidden}
.qbar::after{content:'';position:absolute;top:0;left:-60%;width:42%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.30),transparent);animation:qshine 2.8s ease-in-out infinite;pointer-events:none}
@keyframes qshine{0%{left:-60%}55%{left:165%}100%{left:165%}}
.aura{animation:apulse 3s ease-in-out infinite}@keyframes apulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.ring{transform-origin:50px 64px;animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.ring2{transform-origin:50px 64px;animation:spin2 14s linear infinite}@keyframes spin2{to{transform:rotate(-360deg)}}
.halo{transform-origin:50px 34px;animation:hpulse 2.6s ease-in-out infinite}@keyframes hpulse{0%,100%{opacity:.5}50%{opacity:1}}
.wing{transform-origin:50px 70px;animation:flap 3s ease-in-out infinite}@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.08)}}
.bolt{animation:flick .35s steps(2) infinite}@keyframes flick{0%,100%{opacity:.3}50%{opacity:.95}}
.hero{animation:bob 3.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pcl{animation:rise 2.4s ease-in infinite}@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-46px);opacity:0}}
.flt{position:absolute;font-weight:800;text-shadow:0 1px 4px #000;pointer-events:none;animation:flup .85s ease-out forwards}
@keyframes flup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-34px);opacity:0}}
.mob{cursor:pointer;user-select:none;animation:mobin .4s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
.mob:active{transform:scale(.9)}
@keyframes mobin{0%{transform:scale(.5) rotate(-8deg);opacity:.25}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes mobico-in{0%{transform:scale(.5) rotate(-8deg);opacity:.25}100%{transform:scale(1) rotate(0);opacity:1}}
.card{background:linear-gradient(155deg, rgba(20,30,24,.94), rgba(13,20,16,.94));border:1px solid rgba(216,182,90,.14);border-radius:14px;padding:14px;box-shadow:0 6px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04)}
.H{color:var(--gold);font-weight:700;margin-bottom:6px;font-family:Georgia,serif}
.row{display:flex;justify-content:space-between;font-size:15px;padding:1px 0}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#22302a;border-radius:3px}
textarea{width:100%;background:#0d1410;color:#e8e2d2;border:1px solid #22302a;border-radius:8px;padding:8px;font-size:13px;resize:vertical;font-family:inherit}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.73);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal{max-width:400px;width:100%;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:18px}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.67);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:50}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,110%);background:linear-gradient(180deg,#16211b,#0d1410);border:1px solid var(--gold);border-bottom:none;border-radius:18px 18px 0 0;box-shadow:0 -10px 36px rgba(0,0,0,.73);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:51;padding:8px 14px calc(16px + env(safe-area-inset-bottom,0px))}
#sheet.on{transform:translate(-50%,0)}
#navBtn{margin-top:8px;flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:14px 16px;border-radius:14px;border:1px solid var(--gold);background:linear-gradient(180deg,#1f2c24,#131d17);color:var(--gold);font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 -3px 18px rgba(216,182,90,.14);transition:transform .08s ease}
#navBtn:active{transform:scale(.985)}
#navbar{margin-top:8px;flex:0 0 auto;display:flex;gap:6px;padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px));border-radius:16px;border:1px solid var(--border);background:linear-gradient(180deg,#16211b,#0d1410);box-shadow:0 -4px 20px rgba(0,0,0,.45)}
.navItem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--sub);cursor:pointer;transition:transform .08s ease,background .15s ease,color .15s ease}
.navItem .ni{font-size:23px;line-height:1;filter:grayscale(.35);opacity:.82;transition:filter .15s ease,opacity .15s ease}
.navItem .nl{font-size:11.5px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.navItem:active{transform:scale(.93)}
.navItem.on{background:linear-gradient(180deg,#22312a,#141e18);border-color:#d8b65a55;color:var(--gold);box-shadow:0 0 0 1px #d8b65a40,0 4px 14px rgba(216,182,90,.16)}
.navItem.on .ni{filter:none;opacity:1}
.sheetTab{display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 4px;border-radius:14px;border:1px solid var(--border);background:var(--panel2);color:var(--sub);cursor:pointer;transition:transform .08s ease,border-color .15s ease}
.sheetTab:active{transform:scale(.94)}
.sheetTab.on{border-color:var(--gold);background:linear-gradient(180deg,#22312a,#141e18);color:var(--gold);box-shadow:0 0 0 1px #d8b65a55,0 5px 16px rgba(216,182,90,.2)}
/* Avatar V3 */
.av-wrap{width:140px;height:160px;position:relative;margin:0 auto}
.av-svg{width:140px;height:160px;animation:avFloat 3.2s ease-in-out infinite}
@keyframes avFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.av-aura{position:absolute;inset:-15px;border-radius:50%;background:radial-gradient(circle,rgba(111,192,160,.3),transparent 65%);animation:avAura 3s ease-in-out infinite;pointer-events:none}
@keyframes avAura{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.9;transform:scale(1.1)}}
/* Monster icons */
.mob-ico{width:90px;height:90px;display:flex;align-items:center;justify-content:center;animation:mobico-in .4s cubic-bezier(.34,1.56,.64,1);cursor:pointer;user-select:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.mob-ico.boss{width:110px;height:110px}
.mob-ico:active{transform:scale(.9)}
.mob-ico svg{width:100%;height:100%}
/* Item icons */
.it-ico{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-right:3px}
.it-ico svg{width:18px;height:18px}

/* === Accessibility & Best Practices === */
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}
}

/* ============ SPECTACULAR VISUAL UPGRADE ============ */
/* grander avatar frame + rotating conic halo behind the figure */
.av-wrap{width:166px;height:190px;isolation:isolate;overflow:visible}
.av-svg{width:166px;height:190px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.55))}
.av-aura{top:-22px;right:-22px;bottom:-22px;left:-22px;background:radial-gradient(circle,rgba(216,182,90,.20),rgba(111,192,160,.16) 42%,transparent 68%)}
.av-wrap::before{content:'';position:absolute;top:-30px;right:-30px;bottom:-30px;left:-30px;border-radius:50%;z-index:0;pointer-events:none;
  background:-webkit-conic-gradient(from 0deg,transparent,rgba(216,182,90,.12),transparent 28%,rgba(127,214,230,.12),transparent 58%,rgba(111,192,160,.10),transparent 88%);
  background:conic-gradient(from 0deg,transparent,rgba(216,182,90,.12),transparent 28%,rgba(127,214,230,.12),transparent 58%,rgba(111,192,160,.10),transparent 88%);
  animation:avSpin 16s linear infinite;will-change:transform}
@keyframes avSpin{to{transform:rotate(360deg) translateZ(0)}}
.av-imm .av-aura{top:-22px;right:-22px;bottom:-22px;left:-22px;background:radial-gradient(circle,rgba(255,233,168,.42),rgba(255,210,120,.20) 46%,transparent 70%);animation-duration:2.4s}
.av-imm::before{background:-webkit-conic-gradient(from 0deg,transparent,rgba(255,233,168,.22),transparent 25%,rgba(255,210,120,.16),transparent 55%,rgba(255,233,168,.2),transparent 85%);background:conic-gradient(from 0deg,transparent,rgba(255,233,168,.22),transparent 25%,rgba(255,210,120,.16),transparent 55%,rgba(255,233,168,.2),transparent 85%);animation-duration:10s}

/* ambient drifting star/qi field behind the UI */
#app::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;will-change:opacity;
  background-image:
    radial-gradient(1px 1px at 18% 28%,rgba(216,182,90,.55),transparent),
    radial-gradient(1px 1px at 72% 18%,rgba(127,214,230,.55),transparent),
    radial-gradient(1.6px 1.6px at 41% 66%,rgba(111,192,160,.45),transparent),
    radial-gradient(1px 1px at 86% 58%,rgba(216,182,90,.42),transparent),
    radial-gradient(1px 1px at 13% 78%,rgba(127,214,230,.42),transparent),
    radial-gradient(1.5px 1.5px at 61% 86%,rgba(111,192,160,.4),transparent);
  background-repeat:no-repeat;animation:skyTwinkle 6s ease-in-out infinite alternate}
@keyframes skyTwinkle{0%{opacity:.3}100%{opacity:.85}}
#shell{position:relative;z-index:1}
#mist{opacity:.10;animation-duration:16s}

/* card + heading accents */
.H{position:relative}
.H::after{content:'';position:absolute;left:0;bottom:-3px;width:32px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold,#d8b65a),transparent)}

/* glow aura behind monsters; bosses pulse danger-red */
.mob-ico{position:relative;contain:layout paint}
.mob-ico::before{content:'';position:absolute;top:-14%;right:-14%;bottom:-14%;left:-14%;border-radius:50%;z-index:0;background:radial-gradient(circle,rgba(127,214,230,.18),transparent 66%);animation:avAura 3.2s ease-in-out infinite}
.mob-ico.boss::before{top:-18%;right:-18%;bottom:-18%;left:-18%;background:radial-gradient(circle,rgba(217,117,106,.30),rgba(255,154,60,.14) 45%,transparent 70%)}

/* breakthrough-ready button shimmer already pulses; give the qi bar a faint outer glow on hover-capable */
.qbar::after{height:100%}
.qbar{flex-shrink:0}

/* compact avatar docked top-right in the header (nudged inward from the edge) */
.av-hd{margin:0 22px 0 0;flex-shrink:0;align-self:flex-start;contain:layout}
.av-hd .av-wrap,.av-hd .av-svg{width:68px;height:78px}
.av-hd .av-aura{top:-3px;right:-3px;bottom:-3px;left:-3px}
.av-hd .av-wrap::before{top:-5px;right:-5px;bottom:-5px;left:-5px}
.av-hd .av-svg{filter:drop-shadow(0 3px 8px rgba(0,0,0,.45))}

/* kill / boss-defeat particle burst */
.brst{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;color:var(--gold,#d8b65a);box-shadow:0 0 9px currentColor;transform:translate(-50%,-50%);animation:brstFly .76s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes brstFly{0%{opacity:1;transform:translate3d(-50%,-50%,0) scale(1.1)}100%{opacity:0;transform:translate3d(var(--dx,0),var(--dy,0),0) scale(.3)}}

/* === Accessibility & Performance Hardening === */
@media (prefers-reduced-motion: reduce){
  .av-wrap::before,.av-imm::before{animation:none!important}
  #app::before{animation:none!important;opacity:.5!important}
  .mob-ico::before{animation:none!important;opacity:.6!important}
  .brst{animation-duration:0.01ms!important}
  .av-svg{animation:none!important}
  .av-aura{animation:none!important;opacity:.6!important}
}
/* GPU layers: .av-wrap::before(rotating halo), #app::before(twinkle stars), .mob-ico::before(glow) */
/* Containment: .av-wrap(isolate), .mob-ico(layout paint), .av-hd(layout) */
/* Fallbacks: all var() include default hex values for resilience */

/* ===== จุดแจ้งเตือนแดงบนปุ่ม ===== */
.navItem .ni{position:relative;display:inline-block}
.dotbadge{position:absolute;top:-3px;right:-7px;width:9px;height:9px;border-radius:50%;background:#ff4d4d;border:1.5px solid #0d1410;box-shadow:0 0 7px rgba(255,77,77,.85);animation:dotpulse 1.4s ease-in-out infinite;pointer-events:none}
@keyframes dotpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.28);opacity:.7}}

/* ===== พื้นหลังดาว (CSS-only starfield, เบาเครื่อง) ===== */
#stars{position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.4px 1.4px at 28px 36px,#d8e8ff,transparent),
    radial-gradient(1px 1px at 122px 88px,#ffffff,transparent),
    radial-gradient(1px 1px at 76px 158px,#a9c4e6,transparent),
    radial-gradient(1.6px 1.6px at 184px 56px,#ffffff,transparent),
    radial-gradient(1px 1px at 224px 138px,#8fa6c8,transparent),
    radial-gradient(1.2px 1.2px at 50px 200px,#cfe0ff,transparent),
    radial-gradient(1px 1px at 158px 188px,#ffffff,transparent),
    radial-gradient(1.3px 1.3px at 210px 18px,#bcd2f0,transparent);
  background-size:248px 220px;background-repeat:repeat;opacity:.5;
  animation:twinkle 5.5s ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.32}100%{opacity:.62}}
/* หมอกเซียนนวลๆ ด้านบน (เสริมของเดิม) */
#mist{background:radial-gradient(120% 70% at 50% -10%, rgba(111,192,160,.18), transparent 62%),radial-gradient(90% 50% at 80% 8%, rgba(127,150,230,.12), transparent 60%)}

/* ===== แถบลัด + กริดค่าพลัง หน้าหลัก ===== */
.qarail{display:flex;gap:7px;justify-content:space-between;margin-bottom:10px}
.qa{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:14px;border:1px solid var(--border);background:linear-gradient(180deg,#16211b,#0d1410);cursor:pointer;position:relative;transition:transform .08s ease}
.qa:active{transform:scale(.93)}
.qa .qi{font-size:21px;line-height:1;position:relative}
.qa .ql{font-size:11.5px;color:var(--sub);font-weight:600;white-space:nowrap}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.scell{background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:9px 4px;text-align:center}
.scell .sv{font-size:16px;font-weight:700;line-height:1.2}
.scell .sl{font-size:11px;color:var(--sub);margin-top:2px}

/* ===== PART 1: JUICE LAYER ===== */
/* ปุ่มกดทุกปุ่มมีฟีดแบ็กสัมผัส */
.b{transition:transform .07s ease, filter .07s ease}
.b:active{transform:scale(.955);filter:brightness(1.1)}
/* screen shake (เฉพาะ #shell ไม่กระทบพื้นหลังดาว) */
@keyframes shakeKey{
  10%,90%{transform:translate(-1px,0)}
  20%,80%{transform:translate(1px,-1px)}
  30%,50%,70%{transform:translate(calc(var(--shmag,5px) * -1),1px)}
  40%,60%{transform:translate(var(--shmag,5px),-1px)}
}
.shaking{animation:shakeKey .42s cubic-bezier(.36,.07,.19,.97) both;will-change:transform}
/* FX overlay (ลอยเหนือทุกอย่าง คลิกทะลุ) */
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:9000;overflow:hidden;contain:layout paint}
.fxpop{position:fixed;transform:translate(-50%,0);font-weight:800;font-size:18px;letter-spacing:.3px;text-shadow:0 1px 4px #000,0 0 8px currentColor;pointer-events:none;will-change:transform,opacity;animation:fxpopUp .82s ease-out forwards}
@keyframes fxpopUp{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}16%{opacity:1;transform:translate(-50%,-2px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-42px) scale(1)}}
.fxtoast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:Georgia,serif;font-weight:800;font-size:30px;color:var(--gold);text-shadow:0 2px 10px #000,0 0 24px currentColor;white-space:nowrap;text-align:center;pointer-events:none;will-change:transform,opacity;animation:fxToastAnim 1.45s cubic-bezier(.2,.8,.2,1) forwards}
.fxtoast .sub{display:block;font-size:15px;font-weight:600;margin-top:4px;opacity:.9}
@keyframes fxToastAnim{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}32%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-58%) scale(1)}100%{opacity:0;transform:translate(-50%,-86%) scale(1)}}
@media (prefers-reduced-motion: reduce){
  .shaking,.fxpop,.fxtoast{animation-duration:.01ms!important}
  .b:active{transform:none}
}

</style>
</head>
<body>
<div id="app"><div id="stars"></div><div id="mist"></div><div id="shell"></div></div>
<script>
"use strict";
// ==================== BOOT: ปิดข้อความ console ====================
// ปิด console ทั้งหมดโดยปริยาย (self-test, คำเตือน ฯลฯ จะไม่โผล่)
// อยากเปิดดูเพื่อดีบัก: ตั้ง window.DEBUG = true ก่อนโหลด หรือเรียก window.enableConsole()
(function(){
  if(typeof window === 'undefined') return;
  if(typeof window.DEBUG === 'undefined') window.DEBUG = false;
  var real = window.console || {};
  window._console = real;                 // เก็บ console ตัวจริงไว้ เผื่อต้องใช้
  var METHODS = ['log','info','debug','warn','error','trace','group','groupEnd','groupCollapsed','table','dir','count','time','timeEnd','assert'];
  function noop(){}
  function silence(){
    var q = {};
    for(var i=0;i<METHODS.length;i++) q[METHODS[i]] = noop;
    try { window.console = q; }
    catch(e){ for(var j=0;j<METHODS.length;j++){ try{ window.console[METHODS[j]] = noop; }catch(_){} } }
  }
  window.enableConsole = function(){ try{ window.console = real; }catch(e){} window.DEBUG = true; };
  window.disableConsole = silence;
  if(!window.DEBUG) silence();
})();

"use strict";
// ==================== CONSTANTS ====================
// IIFE ป้องกัน global namespace pollution
(function(){
  "use strict";

  // === Integrity Check: ตรวจสอบ constants ครบถ้วนก่อนใช้ ===
  const REQUIRED = ['REALMS','LOOK','TH','RAR','RARPRE','SLOTS','SLOTLABEL','SLOTN','MOBS','BOSSES','MOBEMO','BOSSEMO','HERBS','TITLES','SAVE_KEY'];

  /**
   * @typedef {Object} Realm
   * @property {string} n - ชื่อระดับการบ่มเพาะ
   * @property {number} sub - จำนวน sub-stages
   */
  /** @type {readonly Realm[]} */
  const REALMS = Object.freeze([
    {n:"มนุษย์ธรรมดา",sub:1},
    {n:"ฝึกชี่",sub:9},
    {n:"สร้างฐาน",sub:9},
    {n:"แกนทอง",sub:9},
    {n:"ทารกหยวน",sub:9},
    {n:"แปรเทพ",sub:9},
    {n:"หลอมความว่าง",sub:9},
    {n:"รวมร่าง",sub:9},
    {n:"มหายาน",sub:9},
    {n:"ข้ามวิบัติ",sub:9},
    {n:"เซียนอมตะ",sub:1}
  ]);

  /**
   * @typedef {Object} Look

  function genItem(scale,boss,slotForce,riForce){

    var w = boss ? [10,26,33,21,10] : [56,27,11,5,1];

    w = w.map(function(x,i){
      return i >= 2 ? x + sh * (i-1) * 0.4 : Math.max(1, x - sh * 0.2);
    });

    var ri = (riForce != null) ? toNum(riForce,0) : widx(w);
    ri = clamp(ri, 0, RAR.length - 1);
    var rar = RAR[ri];
    var sc = scale * rar.m;
    var rb = 1 + ri * 0.4;

    var it = {
      id: genId(),
      slot: slot,
      ri: ri,
      atk: 0, def: 0, hp: 0, cr: 0, cd: 0, culti: 0,
      name: (RARPRE[ri] ? RARPRE[ri] + " " : "") + pick(SLOTN[slot])
    };

    // Stat distribution by slot
    var r = function(v){ return Math.max(0, Math.round(v)); };
    switch(slot){
      case "weapon": it.atk = r(sc * 1.2); it.cd = r(rnd(5,14) * rb); break;
      case "helm":   it.hp  = r(sc * 8);   it.def = r(sc * 0.7); break;

      // Test parseSave envelope
      var testData = '{"v":5,"qi":100}';
      var env = JSON.stringify({v:5, sum:checksum(testData), data:testData});
      var parsed = parseSave(env);
      if(parsed.v !== 5 || parsed.qi !== 100) throw new Error('parseSave envelope failed');

      // Test parseSave legacy
      var legacy = '{"v":3,"qi":200}';
      var parsed2 = parseSave(legacy);
      if(parsed2.v !== 3 || parsed2.qi !== 200) throw new Error('parseSave legacy failed');

      // Test parseSave checksum fail
      var badEnv = JSON.stringify({v:5, sum:"bad", data:testData});
      try { parseSave(badEnv); throw new Error('should have thrown'); }
      catch(e){ if(e.message.indexOf('Checksum') === -1 && e.message.indexOf('checksum') === -1) throw e; }

      // Test addLog (ตั้ง state ก่อน เพื่อทดสอบเส้นทางปกติโดยไม่มี warning)
      setState(G0());
      addLog("test","ok");
      if(!getState().log || getState().log[0].t !== "test") throw new Error('addLog failed');

      // Test validateState
      if(validateState(null)) throw new Error('validateState null should fail');
      if(!validateState({v:5, up:{}, cu:{}, field:{}, dungeon:{}, gear:{}})){
        throw new Error('validateState valid should pass');
      }

      // Test getSaveVersion
      if(getSaveVersion() !== 5) throw new Error('version wrong');

      console.log('[State] Self-test passed: 10/10 ✓');
    } catch(e) {
      console.error('[State] Self-test FAILED:', e.message);
    }
  })();

"use strict";
// ==================== COMBAT / ACTIONS ====================
(function(){
  "use strict";

  // === Constants ===
  var TAP_MULT = 5;        // การแตะแรงกว่าออโต้หลายเท่า
  var MOB_REWARD = 2;      // ตัวคูณรางวัลจากมอนสเตอร์
  var ENH_MAX = 15;        // ตีบวกสูงสุด
  var RECOVER_MS = 4000;   // เวลาพักฟื้นเมื่อตาย
  var ENH_BREAK_CHANCE = 0.20;  // โอกาสแตกตอน +10 ขึ้นไป
  var ENH_DOWNGRADE_MIN = 5;    // ขั้นต่ำที่จะลดระดับตอนพลาด

  // === Dependencies ===
  var _deps = ['getState','addLog','save','fmt','pATK','pDEF','pHP','pCR','pCD',
               'fScale','dScale','baseQiSec','stoneSec','clickQi','qiNeed',
               'gainMult','gsum','isFinalG','abs','REALMS','TH','UPG','CUP',
               'genItem','dropItem','score','geoCost','maxAfford',
               'fieldSpawn','dunSpawn','recipesFactory','dailyTick',
               'spawnFloat','burst','flash','setMsg','buildTab'];
  for(var i=0;i<_deps.length;i++){
    if(typeof window[_deps[i]] === 'undefined'){
      console.warn('[Combat] Missing dependency: '+_deps[i]);
    }
  }

  // === Safe Access ===
  function toNum(v,f){ f=f||0; var n=Number(v); return isFinite(n)?n:f; }
  function isObj(o){ return o != null && typeof o === 'object'; }
  function getState(){ return (typeof window.getState === 'function') ? window.getState() : (typeof window.g !== 'undefined' ? window.g : null); }
  function esc(s){ return (""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

  // === Callback System (decoupled) ===
  var _afterAction = [];
  function afterAction(cb){ if(typeof cb === 'function') _afterAction.push(cb); }
  function _notify(){ _afterAction.forEach(function(cb){ try{ cb(); }catch(e){} }); }

  // === Internal helpers ===
  function _log(t,k){ if(typeof window.addLog === 'function') window.addLog(t,k); }
  function _save(){ if(typeof window.save === 'function') window.save(); }
  function _buildTab(){ if(typeof window.buildTab === 'function') window.buildTab(); }
  function _setMsg(m){ if(typeof window.setMsg === 'function') window.setMsg(m); }

  function _fxToast(t,s,c){ if(typeof window.fxToast === 'function') window.fxToast(t,s,c); }
  function _dailyTick(k){ if(typeof window.dailyTick === 'function') window.dailyTick(k); }

  /**
   * ดึง monster data จาก field หรือ dungeon
   * @param {Object} g
   * @param {string} where - "field" | "dungeon"
   * @returns {Object|null}
   */
  function _getMon(g,where){
    if(!g || !isObj(g)) return null;
    var cur = where === "field" ? g.field : g.dungeon;
    if(!cur || !isObj(cur)) return null;
    return cur.mon || null;
  }

  /**
   * คำนวณ damage จากการโจมตี
   * @param {Object} g
   * @param {number} mult - ตัวคูณ (1 สำหรับ auto, TAP_MULT สำหรับ tap)
   * @returns {{dmg:number,crit:boolean}}
   */
  function _calcDmg(g,mult){
    mult = toNum(mult, 1);
    var atk = (typeof window.pATK === 'function') ? window.pATK(g) : 0;
    var cr = (typeof window.pCR === 'function') ? window.pCR(g) : 5;
    var cd = (typeof window.pCD === 'function') ? window.pCD(g) : 50;
    var dmg = Math.floor(atk * mult * (0.9 + Math.random() * 0.3));
    var crit = Math.random() * 100 < cr;
    if(crit) dmg = Math.floor(dmg * (1 + cd / 100));
    return {dmg: dmg, crit: crit};
  }

  /**
   * คำนวณ damage ที่ผู้เล่นได้รับจากมอนสเตอร์
   * @param {Object} g
   * @param {Object} m - monster
   * @param {boolean} isDungeon
   * @returns {number}
   */
  function _calcTaken(g,m,isDungeon){
    var defVal = (typeof window.pDEF === 'function') ? window.pDEF(g) : 5;
    var defRed = Math.min(0.85, defVal * 0.008);
    var baseAtk = toNum(m.atk, 1);
    var mult = isDungeon ? 1.4 : 1;
    return Math.max(1, Math.floor(baseAtk * mult * (1 - defRed)));
  }

  // ==================== PASSIVE COMBAT ====================
  /**
   * ระบบต่อสู้อัตโนมัติ (เรียกจาก game loop)
   */
  function passiveCombat(){
    var g = getState();
    if(!g || !isObj(g)) return;

    // สู้เฉพาะแท็บที่กำลังเปิด
    var tab = g.tab || "";
    var where = tab === "hunt" ? "field" : tab === "tower" ? "dungeon" : null;
    if(!where) return;

    // กำลังพักฟื้น
    if(Date.now() < (g.recoverUntil || 0)) return;

    var cur = where === "field" ? g.field : g.dungeon;
    if(!cur || !isObj(cur)) return;

    // Spawn monster ถ้ายังไม่มี
    if(!cur.mon){
      if(where === "field" && typeof window.fieldSpawn === 'function') window.fieldSpawn(g);
      else if(typeof window.dunSpawn === 'function') window.dunSpawn(g);
    }
    if(!cur.mon) return;

    var m = cur.mon;
    var result = _calcDmg(g, 1);
    m.hp = toNum(m.hp, 0) - result.dmg;
    _spawnFloat(where === "field" ? "mobArea" : "dunArea", result.dmg, result.crit);

    if(m.hp <= 0){
      if(where === "field") fieldKill();
      else dunKill();
      return;
    }

    // Monster counter-attack
    var taken = _calcTaken(g, m, where === "dungeon");
    g.hp = (g.hp != null ? toNum(g.hp, 0) : (typeof window.pHP === 'function' ? window.pHP(g) : 100)) - taken;

    if(g.hp <= 0){
      g.hp = 0;
      g.recoverUntil = Date.now() + RECOVER_MS;
      var msg = where === "dungeon"
        ? "บาดเจ็บหนัก! ถอยออกมาพักฟื้นชั่วครู่ (หอคอยหยุดไต่)"
        : "บาดเจ็บหนัก! ถอยออกมาพักฟื้นชั่วคราว (หยุดล่าชั่วคราว)";
      _log(msg, "bad");
    }
  }

  // ==================== KILL HANDLERS ====================
  /**
   * จัดการเมื่อสังหารมอนสเตอร์ในสนาม
   */
  function fieldKill(){
    var g = getState();
    if(!g || !isObj(g) || !g.field || !g.field.mon) return;

    var m = g.field.mon;
    var s = toNum(g.field.stage, 1);

    // รางวัลหิน
    var stoneGain = Math.floor(
      (2 + s * 1.4) * Math.pow(1.16, s - 1) * (m.boss ? 6 : 1)
      * ((typeof window.gainMult === 'function') ? window.gainMult(g) : 1)
      * MOB_REWARD
    );
    g.stones = toNum(g.stones, 0) + stoneGain;

    // รางวัลชี่
    var qiGain = ((typeof window.baseQiSec === 'function') ? window.baseQiSec(g) : 1)
      * (m.boss ? 8 : 1.5) * MOB_REWARD;
    g.qi = toNum(g.qi, 0) + qiGain;

    g.totalKills = toNum(g.totalKills, 0) + 1;
    _dailyTick("kills");

    // บอส: ได้เพชร
    if(m.boss){
      g.gems = toNum(g.gems, 0) + ((typeof window.rnd === 'function') ? Math.floor(window.rnd(2, 6)) : 3);
    }

    // สมุนไพร
    if(Math.random() < (m.boss ? 1 : 0.3)){
      var p = s < 6 ? ["a","a","b"] : s < 14 ? ["a","b","b","c"] : ["b","c","c","d"];
      var herb = (typeof window.pick === 'function') ? window.pick(p) : p[0];
      if(herb && g.herbs) g.herbs[herb] = toNum(g.herbs[herb], 0) + (m.boss ? 2 : 1);
    }

    // ดรอปไอเทม
    if(Math.random() < (m.boss ? 0.9 : 0.1)){
      if(typeof window.genItem === 'function' && typeof window.dropItem === 'function' && typeof window.fScale === 'function'){
        var it = window.genItem(window.fScale(g), m.boss);
        if(it) window.dropItem(g, it);
      }
    }

    // Level progression
    if(m.boss){
      g.field.stage = s + 1;
      g.field.killsStage = 0;
      _log("สังหาร " + m.name + " บุกสู่แดนล่าด่าน " + g.field.stage, "gold");
    } else {
      g.field.killsStage = toNum(g.field.killsStage, 0) + 1;
    }

    _burst("mobArea", m.boss ? "#ff9a3c" : "#7fd6e6", m.boss ? 20 : 9);
    if(m.boss){ _shake(0.8); _fxToast("ปราบราชาปีศาจ!", "เลื่อนสู่ด่าน " + (toNum(g.field.stage,1)), "var(--crit)"); }

    if(typeof window.fieldSpawn === 'function') window.fieldSpawn(g);
    _save();
  }

  /**
   * จัดการเมื่อสังหารมอนสเตอร์ในหอคอย
   */
  function dunKill(){
    var g = getState();
    if(!g || !isObj(g) || !g.dungeon || !g.dungeon.mon) return;

    var m = g.dungeon.mon;
    var f = toNum(g.dungeon.floor, 1);

    // รางวัลเหรียญ
    var coinGain = Math.floor(
      (1 + f * 0.6 + Math.pow(f, 1.05) * 0.4)
      * (m.guard ? 5 : 1)
      * ((typeof window.gainMult === 'function') ? window.gainMult(g) : 1)
      * MOB_REWARD
    );
    g.coins = toNum(g.coins, 0) + coinGain;

    // รางวัลชี่
    var qiGain = ((typeof window.baseQiSec === 'function') ? window.baseQiSec(g) : 1)
      * (m.guard ? 4 : 1) * MOB_REWARD;
    g.qi = toNum(g.qi, 0) + qiGain;

    g.totalKills = toNum(g.totalKills, 0) + 1;
    _dailyTick("kills");

    if(m.guard){
      g.gems = toNum(g.gems, 0) + ((typeof window.rnd === 'function') ? Math.floor(window.rnd(3, 8)) : 5);
    }

    // ดรอปไอเทม
    if(m.guard || Math.random() < 0.22){
      if(typeof window.genItem === 'function' && typeof window.dropItem === 'function' && typeof window.dScale === 'function'){
        var it = window.genItem(window.dScale(g), m.guard);
        if(it) window.dropItem(g, it);
      }
    }

    // Floor progression
    if(!g.dungeon.farm){
      g.dungeon.floor = f + 1;
      if(g.dungeon.floor > g.dungeon.best){
        g.dungeon.best = g.dungeon.floor;
        if(g.dungeon.best % 25 === 0){
          _log("พิชิตหอคอยเซียนถึงชั้น " + g.dungeon.best, "gold");
        }
      }
    }

    // ผู้พิทักษ์: เพิ่ม clone max
    if(m.guard){
      g.clones = g.clones || {};
      g.clones.max = toNum(g.clones.max, 6) + 5;
    }

    _burst("dunArea", m.guard ? "#ff9a3c" : "#8fd0c8", m.guard ? 20 : 9);
    if(m.guard){ _shake(0.7); }

    if(typeof window.dunSpawn === 'function') window.dunSpawn(g);
    _save();
  }

  // ==================== TAP COMBAT ====================
  /**
   * ผู้เล่นแตะโจมตีมอนสเตอร์ในสนาม
   */
  function tapMob(){
    var g = getState();
    if(!g || !isObj(g)) return;

    if(Date.now() < (g.recoverUntil || 0)){
      _setMsg("กำลังพักฟื้น รอสักครู่");
      return;
    }

    if(!g.field) g.field = {};
    if(!g.field.mon){
      if(typeof window.fieldSpawn === 'function') window.fieldSpawn(g);
      return;
    }

    var m = g.field.mon;
    var result = _calcDmg(g, TAP_MULT);
    m.hp = toNum(m.hp, 0) - result.dmg;
    _spawnFloat("mobArea", result.dmg, result.crit);

    if(m.hp <= 0) fieldKill();
  }

  /**
   * ผู้เล่นแตะโจมตีมอนสเตอร์ในหอคอย
   */
  function tapDungeon(){
    var g = getState();
    if(!g || !isObj(g)) return;

    if(Date.now() < (g.recoverUntil || 0)){
      _setMsg("กำลังพักฟื้น รอสักครู่");
      return;
    }

    if(!g.dungeon) g.dungeon = {};
    if(!g.dungeon.mon){
      if(typeof window.dunSpawn === 'function') window.dunSpawn(g);
      return;

    var m = g.dungeon.mon;
    var result = _calcDmg(g, TAP_MULT);

  // ==================== MEDITATE / BREAKTHROUGH ====================
  /**
   * นั่งสมาธิรับชี่
   */
  function meditate(){
    var g = getState();
    if(!g || !isObj(g)) return;
    var gain = (typeof window.clickQi === 'function') ? window.clickQi(g) : 4;
    g.qi = toNum(g.qi, 0) + gain;
  }

  /**
   * ทะลวงขั้น (breakthrough)
   * @param {boolean} silent - true = ไม่แสดง log ถ้าสำเร็จชั้นเล็ก
   */
  function breakthrough(silent){
    var g = getState();
    if(!g || !isObj(g)) return;

    // เช็ค realm สูงสุด
    if(typeof window.isFinalG === 'function' && window.isFinalG(g)) return;

    // เช็คชี่พอ
    var nd = (typeof window.qiNeed === 'function') ? window.qiNeed(g.ri, g.layer) : Infinity;
    if(toNum(g.qi, 0) < nd) return;

    var realms = (typeof window.REALMS !== 'undefined') ? window.REALMS : [];
    var ri = toNum(g.ri, 0);
    if(ri < 0 || ri >= realms.length) return;

    var rm = realms[ri];
    if(!rm) return;

    var top = g.layer >= (rm.sub || 1);

    if(top){
      // ทะลวงขั้นใหญ่: มีโอกาสล้มเหลว
      var gs = (typeof window.gsum === 'function') ? window.gsum(g) : {culti:0};
      var passRate = Math.min(0.95, 0.68 + toNum(gs.culti, 0) * 0.004);
      var passed = Math.random() < passRate;

      if(passed || toNum(g.protect, 0) > 0){
        if(!passed && g.protect > 0){
          g.protect--;
          var nextRealm = realms[ri + 1];
          var nextName = nextRealm ? nextRealm.n : "ขั้นต่อไป";
          _log("วิบัติฟ้าโถม แต่เม็ดยาคุ้มครองธาตุปกป้องไว้ ก้าวสู่ขั้น " + nextName, "warn");
        } else {
          var nextRealm2 = realms[ri + 1];
          var nextName2 = nextRealm2 ? nextRealm2.n : "ขั้นต่อไป";
          _log("ฝ่าวิบัติฟ้าสำเร็จ ก้าวสู่ขั้น " + nextName2, "gold");
        }
        g.qi = 0;
        g.ri = ri + 1;
        g.layer = 1;
        g.stones = toNum(g.stones, 0) + Math.floor(nd * 0.2 + g.ri * 60);
        g.clones = g.clones || {};
        g.clones.max = toNum(g.clones.max, 6) + 35;
        _dailyTick("breaks");
        _flash("gold");
        _shake(1.3);
        _fxToast("ฝ่าวิบัติฟ้าสำเร็จ!", "ก้าวสู่ขั้น " + ((realms[ri+1]&&realms[ri+1].n)||""), "var(--gold)");
      } else {
        g.qi = toNum(g.qi, 0) * 0.6;
        _log("ฝ่าวิบัติฟ้าล้มเหลว พลังชี่กระจัดกระจาย ตั้งสติสะสมใหม่", "bad");
        _flash("bad");
        _shake(0.9);
      }
    } else {
      // เลื่อนชั้นเล็ก (ไม่มีความเสี่ยง)
      g.qi = toNum(g.qi, 0) - nd;
      g.layer = toNum(g.layer, 1) + 1;
      g.stones = toNum(g.stones, 0) + Math.floor(nd * 0.08 + 2);
      _dailyTick("breaks");

      if(!silent){
        var th = (typeof window.TH !== 'undefined') ? window.TH : [];
        var layerName = th[g.layer] || g.layer;
        _log("บำเพ็ญก้าวหน้า สู่ " + rm.n + " ชั้น" + layerName);
      }
    }

    _save();
    _buildTab();
  }

  // ==================== UPGRADES ====================
  /**
   * ซื้ออัปเกรด
   * @param {string} group - "up" หรือ "cu"
   * @param {string} key - upgrade key
   */
  function buyUp(group, key){
    var g = getState();
    if(!g || !isObj(g)) return;

    var arr = group === "up" ?
      ((typeof window.UPG !== 'undefined') ? window.UPG : []) :
      ((typeof window.CUP !== 'undefined') ? window.CUP : []);

    var u = null;
    for(var i = 0; i < arr.length; i++){
      if(arr[i] && arr[i].key === key){ u = arr[i]; break; }
    }
    if(!u) return;

    g[group] = g[group] || {};
    var owned = toNum(g[group][key], 0);
    var want = g.buyMul === "max" ? Infinity : toNum(g.buyMul, 1);
    var maxK = (typeof window.maxAfford === 'function') ?
      window.maxAfford(u.base, u.scale, owned, toNum(g.stones, 0)) : 0;
    var k = Math.min(want, maxK);

    while(k >= 1){
      var cost = (typeof window.geoCost === 'function') ?
        window.geoCost(u.base, u.scale, owned, k) : Infinity;
      if(cost <= toNum(g.stones, 0)) break;
      k--;
    }
    if(k < 1) return;

    var finalCost = (typeof window.geoCost === 'function') ?
      window.geoCost(u.base, u.scale, owned, k) : 0;
    g.stones = toNum(g.stones, 0) - finalCost;
    g[group][key] = owned + k;
    _save();
    _buildTab();
  }

  // ==================== CRAFTING ====================
  /**
   * ปรุงยาจากสูตร
   * @param {number} i - index ของสูตร
   */
  function craftRecipe(i){
    var g = getState();
    if(!g || !isObj(g)) return;
    if(!Number.isFinite(i) || i < 0) return;

    var factory = (typeof window.recipesFactory === 'function') ? window.recipesFactory() : null;
    if(!factory){
      // Fallback: ถ้ายังไม่ได้แก้ไฟล์ 03 ให้ใช้ window.recipes
      factory = (typeof window.recipes === 'function') ? window.recipes : function(){ return []; };
    }
    var rs = factory(g);
    if(!Array.isArray(rs) || i >= rs.length) return;

    var r = rs[i];
    if(!r || !isObj(r) || !isObj(r.cost)) return;

    // เช็คสมุนไพรพอ
    var ok = Object.keys(r.cost).every(function(k){
      return g.herbs && toNum(g.herbs[k], 0) >= toNum(r.cost[k], 0);
    });
    if(!ok) return;

    // ใช้สมุนไพร
    Object.keys(r.cost).forEach(function(k){
      if(g.herbs) g.herbs[k] = toNum(g.herbs[k], 0) - toNum(r.cost[k], 0);
    });

    // ทำ effect
    if(typeof r.do === 'function') r.do();

    _dailyTick("crafts");
    _log("ปรุง " + r.name + " สำเร็จ", "jade");
    _save();
    _buildTab();
  }

  // ==================== INVENTORY ====================
  /**
   * สวมใส่อุปกรณ์จากกระเป๋า
   * @param {string} id - item id
   */
  function equipItem(id){
    var g = getState();
    if(!g || !isObj(g) || !Array.isArray(g.inv) || !isObj(g.gear)) return;

    var idx = g.inv.findIndex(function(x){ return x && x.id === id; });
    if(idx < 0) return;

    var it = g.inv[idx];
    if(!it || !it.slot) return;

    g.inv.splice(idx, 1);
    if(g.gear[it.slot]) g.inv.unshift(g.gear[it.slot]);
    g.gear[it.slot] = it;
    _save();
    _buildTab();
  }

  /**
   * ขายอุปกรณ์
   * @param {string} id - item id
   */
  function sellItem(id){
    var g = getState();
    if(!g || !isObj(g) || !Array.isArray(g.inv)) return;

    var idx = g.inv.findIndex(function(x){ return x && x.id === id; });
    if(idx < 0) return;

    var it = g.inv[idx];
    g.inv.splice(idx, 1);

    var itemScore = (typeof window.score === 'function') ? window.score(it) : 0;
    var sellVal = 5 + toNum(it.ri, 0) * 15 + Math.floor(itemScore * 0.05);
    g.stones = toNum(g.stones, 0) + sellVal;
    _save();
    _buildTab();
  }

  /**
   * ขายของธรรมดาทั้งหมด (ri <= 1)
   */
  function sellJunk(){
    var g = getState();
    if(!g || !isObj(g) || !Array.isArray(g.inv)) return;

    var keep = [], got = 0;
    for(var i = 0; i < g.inv.length; i++){
      var it = g.inv[i];
      if(it && toNum(it.ri, 0) <= 1){
        got += 5 + toNum(it.ri, 0) * 15;
      } else {
        keep.push(it);
      }
    }
    g.inv = keep;
    g.stones = toNum(g.stones, 0) + got;
    _log("หลอมของสามัญทั้งหมด ได้ " + ((typeof window.fmt === 'function') ? window.fmt(got) : got) + " หินวิญญาณ", "ok");
    _save();
    _buildTab();
  }

  // ==================== ENHANCEMENT ====================
  /**
   * คำนวณอัตราความสำเร็จตีบวก
   * @param {number} e - ระดับปัจจุบัน
   * @returns {number}
   */
  function enhRate(e){
    e = toNum(e, 0);
    return Math.max(0.10, 0.95 - e * 0.057);
  }

  /**
   * คำนวณต้นทุนตีบวก
   * @param {Object} it
   * @returns {number}
   */
  function enhCost(it){
    if(!it || !isObj(it)) return Infinity;
    var e = toNum(it.enh, 0);
    var ri = toNum(it.ri, 0);
    return Math.floor(50 * Math.pow(1.7, e) * (1 + ri * 0.6));
  }

  /**
   * ตีบวกอุปกรณ์
   * @param {string} slot - ช่องอุปกรณ์
   */
  function enhanceItem(slot){
    var g = getState();
    if(!g || !isObj(g) || !isObj(g.gear)) return;

    var it = g.gear[slot];
    if(!it){
      _setMsg("ช่องนี้ยังไม่มีอุปกรณ์");
      return;
    }

    var e = toNum(it.enh, 0);
    if(e >= ENH_MAX){
      _setMsg("ตีบวกถึงขั้นสูงสุดแล้ว (+" + ENH_MAX + ")");
      return;
    }

    var cost = enhCost(it);
    if(toNum(g.stones, 0) < cost){
      _setMsg("หินวิญญาณไม่พอ ต้องใช้ ◈" + ((typeof window.fmt === 'function') ? window.fmt(cost) : cost));
      return;
    }

    g.stones = toNum(g.stones, 0) - cost;
    _dailyTick("enh");

    if(Math.random() < enhRate(e)){
      // สำเร็จ
      it.enh = e + 1;
      _setMsg("ตีบวกสำเร็จ! " + it.name + " → +" + (e + 1));
      _log("ตีบวก " + it.name + " สำเร็จ +" + (e + 1), "gold");
      _flash("gold");
      if(e + 1 >= 10){ _shake(0.7); _fxToast("ตีบวกสำเร็จ +" + (e + 1) + "!", it.name, "var(--gold)"); }
    } else {
      // ล้มเหลว
      if(e >= 10 && Math.random() < ENH_BREAK_CHANCE){
        // แตก
        g.gear[slot] = null;
        _setMsg("ล้มเหลว! " + it.name + " แตกสลายเป็นผง");
        _log("ตีบวก " + it.name + " (+" + e + ") ล้มเหลว อุปกรณ์แตกสลาย!", "bad");
        _flash("bad");
        _shake(1.1);
        _fxToast("อุปกรณ์แตกสลาย!", it.name, "var(--danger)");
      } else if(e >= ENH_DOWNGRADE_MIN){
        // ลดระดับ
        it.enh = e - 1;
        _setMsg("ล้มเหลว ระดับลดเหลือ +" + (e - 1));
        _log("ตีบวก " + it.name + " ล้มเหลว ลดเหลือ +" + (e - 1), "warn");
        _flash("bad");
      } else {
        // ไม่ลด
        _setMsg("ล้มเหลว แต่ระดับไม่ลด (ยัง+" + e + ")");
        _log("ตีบวก " + it.name + " ล้มเหลว (ระดับไม่ลด)", "warn");
        _flash("bad");
      }
    }

    _save();
    _buildTab();
  }

  /**
   * สร้าง HTML สำหรับปุ่มตีบวก (ปลอดภัยจาก XSS)
   * @param {string} sl - slot
   * @param {Object} it - item
   * @returns {string}
   */
  function enhCtrl(sl, it){
    if(!it || !isObj(it)) return '';
    var e = toNum(it.enh, 0);
    if(e >= ENH_MAX){
      return '<div style="margin-top:6px;font-size:13px;color:var(--gold);font-weight:600">✦ ตีบวกสูงสุดแล้ว +' + ENH_MAX + '</div>';
    }
    var cost = enhCost(it);
    var rate = Math.round(enhRate(e) * 100);
    var aff = toNum(getState() && getState().stones, 0) >= cost;
    var risk = e >= 10 ? "เสี่ยงแตก!" : (e >= ENH_DOWNGRADE_MIN ? "พลาดลดระดับ" : "ปลอดภัย");

    return '<button class="b" data-act="enh" data-a="' + esc(sl) + '" style="margin-top:7px;width:100%;padding:9px;border-radius:9px;border:1px solid ' + (aff ? "var(--gold)" : "var(--border)") + ';background:' + (aff ? "rgba(216,182,90,.12)" : "transparent") + ';color:' + (aff ? "var(--gold)" : "var(--sub)") + ';font-size:13px;font-weight:700;cursor:pointer">⚒ ตีบวก +' + (e + 1) + ' · ◈' + esc((typeof window.fmt === 'function') ? window.fmt(cost) : cost) + ' · สำเร็จ ' + rate + '% · ' + esc(risk) + '</button>';
  }

  // ==================== Exports ====================
  var EXPORTS = {
    passiveCombat: passiveCombat,
    fieldKill: fieldKill,
    dunKill: dunKill,
    tapMob: tapMob,
    tapDungeon: tapDungeon,
    meditate: meditate,
    breakthrough: breakthrough,
    buyUp: buyUp,
    craftRecipe: craftRecipe,
    equipItem: equipItem,
    sellItem: sellItem,
    sellJunk: sellJunk,
    enhanceItem: enhanceItem,
    enhCtrl: enhCtrl,
    enhRate: enhRate,
    enhCost: enhCost,
    // Config
    TAP_MULT: TAP_MULT,
    ENH_MAX: ENH_MAX,
    MOB_REWARD: MOB_REWARD,
    // Callbacks
    afterAction: afterAction
  };

  Object.keys(EXPORTS).forEach(function(key){
    Object.defineProperty(window, key, {
      value: EXPORTS[key],
      writable: false,
      configurable: false,
      enumerable: true
    });
  });

  // === Self-Test ===
  (function selfTest(){
    try {
      // Test enhRate
      if(enhRate(0) !== 0.95) throw new Error('enhRate(0)='+enhRate(0));
      if(enhRate(15) !== 0.10) throw new Error('enhRate(15)='+enhRate(15));

      // Test enhCost
      var cost0 = enhCost({enh:0,ri:0});
      if(cost0 !== 50) throw new Error('enhCost(0,0)='+cost0);
      var cost10 = enhCost({enh:10,ri:3});
      if(!isFinite(cost10) || cost10 <= 0) throw new Error('enhCost(10,3) invalid');

      // Test esc
      var escaped = esc('<scr'+'ipt>alert("xss")<\/script>');
      if(escaped.indexOf('<') >= 0) throw new Error('esc failed');

      // Test TAP_MULT constant
      if(typeof window.TAP_MULT !== 'number') throw new Error('TAP_MULT not exported');
      if(typeof window.ENH_MAX !== 'number') throw new Error('ENH_MAX not exported');

      console.log('[Combat] Self-test passed: 5/5 ✓');
    } catch(e) {
      console.error('[Combat] Self-test FAILED:', e.message);
    }
  })();
})();

// ==================== สัตว์เลี้ยงวิเศษ (PETS: สุ่มได้ มี rarity ช่วยต่อสู้ มีเลเวล) ====================
var PET={
  dragon:{name:"มังกรเพลิง",icon:"🐲",stat:"atk",base:0.06,desc:"พลังโจมตี"},
  phoenix:{name:"หงส์เพลิง",icon:"🦅",stat:"qi",base:0.08,desc:"พลังชี่/วิ"},
  qilin:{name:"กิเลนนำโชค",icon:"🦌",stat:"gain",base:0.05,desc:"รับรางวัล"},
  turtle:{name:"เต่าศักดิ์สิทธิ์",icon:"🐢",stat:"hp",base:0.10,desc:"พลังชีวิต"},
  tiger:{name:"พยัคฆ์ขาว",icon:"🐯",stat:"atk",base:0.075,desc:"พลังโจมตี"},
  fox:{name:"จิ้งจอกเก้าหาง",icon:"🦊",stat:"crit",base:0.04,desc:"อัตราคริ"}
};
var PET_KEYS=["dragon","phoenix","qilin","turtle","tiger","fox"];
var PET_MAX=24, PET_LV_MAX=30;
function activePet(){ if(typeof g==='undefined'||!g||!g.pet||!g.pet.active||!g.pet.list)return null; for(var i=0;i<g.pet.list.length;i++)if(g.pet.list[i].id===g.pet.active)return g.pet.list[i]; return null; }
function petStatVal(p){ if(!p)return 0; var sp=PET[p.type]; if(!sp)return 0; return sp.base*(1+(p.ri||0)*0.7)*(1+((p.lv||1)-1)*0.08); }
function petBonus(stat){ var p=activePet(); if(!p)return 0; var sp=PET[p.type]; if(!sp||sp.stat!==stat)return 0; return petStatVal(p); }
function petPct(p){ return Math.round(petStatVal(p)*100); }
function petSummonCost(){ return Math.floor(80*Math.pow(1.12,(g.pet&&g.pet.list?g.pet.list.length:0))); }
function petLevelCost(p){ return Math.floor(40*(p.lv||1)*Math.pow(1.28,(p.lv||1))*(1+(p.ri||0)*0.5)); }
function summonPet(){
  if(!g.pet)g.pet={active:null,list:[],seq:0};
  if(g.pet.list.length>=PET_MAX){ setMsg("คอกสัตว์เลี้ยงเต็มแล้ว (สูงสุด "+PET_MAX+") ปล่อยบางตัวก่อน"); return; }
  var cost=petSummonCost(); if(g.coins<cost){ setMsg("เหรียญเซียนไม่พอ ต้องใช้ ❖"+fmt(cost)); return; }
  g.coins-=cost;
  var ri=widx([50,28,14,6,2]), type=PET_KEYS[Math.floor(Math.random()*PET_KEYS.length)];
  var p={id:"p"+(g.pet.seq++),type:type,ri:ri,lv:1};
  g.pet.list.push(p); dailyTick("pets");
  if(!g.pet.active)g.pet.active=p.id;
  setMsg("ฟักไข่ได้ "+PET[type].icon+" "+PET[type].name+" ("+RAR[ri].n+")!");
  addLog("ได้สัตว์เลี้ยง "+RAR[ri].n+" "+PET[type].name,ri>=3?"gold":ri>=2?"jade":"ok"); if(ri>=3)flash("gold");
  save(); buildTab();
}
function setActivePet(id){ if(!g.pet)return; g.pet.active=id; setMsg(""); save(); buildTab(); }
function levelPet(id){
  if(!g.pet)return; var p=null,i; for(i=0;i<g.pet.list.length;i++)if(g.pet.list[i].id===id)p=g.pet.list[i];
  if(!p)return; if((p.lv||1)>=PET_LV_MAX){ setMsg("สัตว์เลี้ยงถึงเลเวลสูงสุดแล้ว"); return; }
  var cost=petLevelCost(p); if(g.coins<cost){ setMsg("เหรียญเซียนไม่พอ ต้องใช้ ❖"+fmt(cost)); return; }
  g.coins-=cost; p.lv=(p.lv||1)+1; setMsg(PET[p.type].name+" เลื่อนขั้นเป็นเลเวล "+p.lv); save(); buildTab();
}
function releasePet(id){
  if(!g.pet)return; var idx=-1,i; for(i=0;i<g.pet.list.length;i++)if(g.pet.list[i].id===id)idx=i;
  if(idx<0)return; var p=g.pet.list[idx], refund=Math.floor(petSummonCost()*0.3);
  g.pet.list.splice(idx,1); g.coins+=refund;
  if(g.pet.active===id)g.pet.active=g.pet.list.length?g.pet.list[0].id:null;
  setMsg("ปล่อย "+PET[p.type].name+" คืนสู่ธรรมชาติ ได้เหรียญคืน ❖"+fmt(refund)); save(); buildTab();
}
// ==================== ภารกิจรายวัน (DAILY QUESTS: 4 เควส/วัน รีเซ็ตเที่ยงคืน) ====================
var DAILY_DEFS={
  kills:{label:"สังหารปีศาจ",unit:"ตัว",goal:function(ri){return 40+ri*15;},rk:"stones"},
  breaks:{label:"ทะลุด่านบำเพ็ญ",unit:"ครั้ง",goal:function(ri){return 2+Math.floor(ri/2);},rk:"qi"},
  crafts:{label:"เล่นแร่ปรุงยา",unit:"เม็ด",goal:function(ri){return 2+Math.floor(ri/3);},rk:"herb"},
  enh:{label:"ตีบวกอุปกรณ์",unit:"ครั้ง",goal:function(ri){return 2+Math.floor(ri/2);},rk:"coins"},
  pets:{label:"ฟักไข่เซียน",unit:"ตัว",goal:function(ri){return 1+Math.floor(ri/5);},rk:"awaken"}
};
var DAILY_KEYS=["kills","breaks","crafts","enh","pets"];
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function dailyResetMs(){ var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,0,0,0,0)-d; }
function dailyAmt(kind){
  var ri=g.ri, rb=g.rebirth||0;
  if(kind==="stones") return Math.floor(150*Math.pow(1.7,ri)*(1+rb*0.6))+50;
  if(kind==="coins")  return Math.floor(80*Math.pow(1.55,ri)*(1+rb*0.4))+20;
  if(kind==="qi")     return Math.floor(baseQiSec(g)*300)+50;
  if(kind==="herb")   return 4+Math.floor(ri/2);
  if(kind==="awaken") return 1;
  return 0;
}
function dailyRewardText(k,amt){ var a=(amt!=null?amt:dailyAmt(k));
  if(k==="stones")return "◈"+fmt(a)+" หินวิญญาณ";
  if(k==="coins") return "❖"+fmt(a)+" เหรียญเซียน";
  if(k==="qi")    return fmt(a)+" พลังชี่";
  if(k==="herb")  return a+" สมุนไพรชั้นดี";
  if(k==="awaken")return a+" จิตเซียน ✦";
  return "";
}
function rollDaily(){
  if(!g.daily)g.daily={day:"",prog:{},quests:[]};
  g.daily.day=todayStr(); g.daily.prog={kills:0,breaks:0,crafts:0,enh:0,pets:0};
  var keys=DAILY_KEYS.slice();
  for(var i=keys.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)),t=keys[i];keys[i]=keys[j];keys[j]=t; }
  keys=keys.slice(0,4);
  var ri=g.ri;
  g.daily.quests=keys.map(function(k){ var rk=DAILY_DEFS[k].rk; return {type:k,goal:DAILY_DEFS[k].goal(ri),rk:rk,rv:dailyAmt(rk),claimed:false}; });
}
function ensureDaily(){ if(!g.daily)g.daily={day:"",prog:{},quests:[]}; if(g.daily.day!==todayStr()||!g.daily.quests||!g.daily.quests.length){ rollDaily(); } }
function dailyTick(type,n){ if(!g.daily)g.daily={day:"",prog:{},quests:[]}; ensureDaily(); g.daily.prog[type]=(g.daily.prog[type]||0)+(n||1); }
function dailyDoneCount(){ if(!g.daily||!g.daily.quests)return 0; var c=0; for(var i=0;i<g.daily.quests.length;i++){ var q=g.daily.quests[i]; if((g.daily.prog[q.type]||0)>=q.goal)c++; } return c; }
function claimDaily(idx){
  ensureDaily(); var q=g.daily.quests[idx]; if(!q||q.claimed)return;
  if((g.daily.prog[q.type]||0)<q.goal){ setMsg("ภารกิจนี้ยังไม่สำเร็จ"); return; }
  q.claimed=true; var k=q.rk,a=(q.rv!=null?q.rv:dailyAmt(k)); q.rv=a;
  if(k==="stones")g.stones+=a; else if(k==="coins")g.coins+=a; else if(k==="qi")g.qi+=a; else if(k==="herb")g.herbs.c+=a; else if(k==="awaken")g.awaken=(g.awaken||0)+a;
  setMsg("รับรางวัลภารกิจ: "+dailyRewardText(k,a)); addLog("ทำภารกิจรายวันสำเร็จ รับ "+dailyRewardText(k,a),"gold"); flash("gold");
  save(); buildTab();
}

// ==================== กาชา / สุ่มพรีเมียม (GACHA: เพชรวิญญาณ → ของเทพ สัตว์เลี้ยง สกิน) ====================
var SKINS=[
  {id:"flame",name:"เปลวเพลิงสวรรค์",c:"#ff7a4d"},
  {id:"ice",name:"น้ำแข็งนิรันดร์",c:"#7fe0ff"},
  {id:"void",name:"รัตติกาลสีม่วง",c:"#c77dff"},
  {id:"gold",name:"ทองคำบริสุทธิ์",c:"#ffd24d"},
  {id:"jade",name:"พิษมรกต",c:"#5be0a0"},
  {id:"blood",name:"โลหิตอสูร",c:"#ff5d6c"}
];
function skinColor(id){ for(var i=0;i<SKINS.length;i++)if(SKINS[i].id===id)return SKINS[i].c; return null; }
function equipSkin(id){ if(!g.skins)g.skins={owned:[],active:null}; if(g.skins.owned.indexOf(id)<0)return; g.skins.active=(g.skins.active===id?null:id); var ha=document.getElementById("hdrAvatar"); if(ha)ha.innerHTML=buildAvatarV3(g.ri,"h"); save(); buildTab(); }
var GACHA_COST1=10, GACHA_COST10=90, GACHA_PITY=50;
function gachaOne(minRi){
  minRi=minRi||0;
  if(!g.skins)g.skins={owned:[],active:null};
  g.gachaPity=(g.gachaPity||0)+1;
  var roll=Math.random();
  var unowned=SKINS.filter(function(s){return g.skins.owned.indexOf(s.id)<0;});
  var res;
  if(minRi<3 && roll<0.07 && unowned.length){
    var sk=unowned[Math.floor(Math.random()*unowned.length)];
    g.skins.owned.push(sk.id);
    res={kind:"skin",name:sk.name,c:sk.c,ri:4};
  } else if(minRi<3 && roll<0.22 && g.pet && g.pet.list.length<PET_MAX){
    var pri=widx([16,30,30,18,6]), ptype=PET_KEYS[Math.floor(Math.random()*PET_KEYS.length)];
    var p={id:"p"+(g.pet.seq++),type:ptype,ri:pri,lv:1};
    g.pet.list.push(p); if(!g.pet.active)g.pet.active=p.id;
    res={kind:"pet",name:PET[ptype].name,icon:PET[ptype].icon,ri:pri};
  } else {
    var gri=(g.gachaPity>=GACHA_PITY)?4:widx([0,10,32,40,18]);
    if(gri<minRi)gri=minRi;
    var it=genItem(fScale(g)*1.7, true, null, gri);
    dropItem(g,it);
    res={kind:"gear",name:it.name,slot:it.slot,ri:gri};
  }
  if((res.ri||0)>=4)g.gachaPity=0;   // รีเซ็ตการันตีเมื่อได้ระดับสูงสุด (สกิน/ของเซียน/สัตว์ตำนาน) ไม่ใช่เฉพาะของ
  return res;
}
function gachaRoll(n){
  var cost=(n>=10)?GACHA_COST10:GACHA_COST1;
  if((g.gems||0)<cost){ setMsg("เพชรวิญญาณไม่พอ ต้องใช้ 💎"+cost+" (ล่าบอส/ผู้พิทักษ์เพื่อเก็บเพชร)"); buildTab(); return; }
  g.gems-=cost;
  var results=[],hasRare=false;
  for(var i=0;i<n;i++){
    var minRi=(n>=10 && i===n-1 && !hasRare)?3:0;   // 10x การันตีอย่างน้อย 1 ชิ้นเซียนขึ้นไป
    var r=gachaOne(minRi);
    if((r.ri||0)>=3)hasRare=true;
    results.push(r);
  }
  g.gachaLast=results;
  var top=results.reduce(function(a,r){return Math.max(a,r.ri||0);},0);
  setMsg(n>=10?"สุ่ม 10 ครั้งสำเร็จ!":"สุ่มสำเร็จ!");
  if(top>=4){ flash("gold"); if(typeof shake==="function")shake(1); if(typeof fxToast==="function")fxToast("ได้ของระดับตำนาน!","✦ "+(RAR[top]&&RAR[top].n||""),"var(--crit)"); }
  else if(top>=3){ flash("gold"); if(typeof fxToast==="function")fxToast("ได้ของหายาก!","✦ "+(RAR[top]&&RAR[top].n||""),"var(--gold)"); }
  save(); buildTab();
}

// ==================== สกุลเงิน · แลกเปลี่ยน · ร้านเพชร · เติมเงิน ====================
// อัตราแลกเปลี่ยนสกุลเงิน (มีค่าธรรมเนียม 20%); เพชร→หิน ปรับตามรายได้ปัจจุบันให้คุ้มค่าทุกช่วงเกม
function exchangeCur(kind){
  if(kind==="c2s"){ // เหรียญเซียน → หินวิญญาณ
    var spend=Math.min(g.coins,Math.max(1000,Math.floor(g.coins*0.25)));
    if(spend<100){ setMsg("เหรียญเซียนไม่พอแลก"); buildTab(); return; }
    var got=Math.floor(spend*0.8); g.coins-=spend; g.stones+=got;
    setMsg("แลก ❖"+fmt(spend)+" → ◈"+fmt(got));
  } else if(kind==="s2c"){ // หินวิญญาณ → เหรียญเซียน
    var sp=Math.min(g.stones,Math.max(1000,Math.floor(g.stones*0.25)));
    if(sp<100){ setMsg("หินวิญญาณไม่พอแลก"); buildTab(); return; }
    var gc=Math.floor(sp*0.8); g.stones-=sp; g.coins+=gc;
    setMsg("แลก ◈"+fmt(sp)+" → ❖"+fmt(gc));
  } else if(kind==="g2s"){ // เพชรวิญญาณ → หินวิญญาณ (พรีเมียม)
    var cost=10; if((g.gems||0)<cost){ setMsg("เพชรวิญญาณไม่พอ (ต้องใช้ 💎"+cost+")"); buildTab(); return; }
    var rate=(typeof stoneSec==="function")?stoneSec(g):50;
    var amt=Math.max(2000,Math.floor(rate*300)); // ~5 นาทีของรายได้หิน
    g.gems-=cost; g.stones+=amt;
    setMsg("แลก 💎"+cost+" → ◈"+fmt(amt));
  } else if(kind==="g2c"){ // เพชรวิญญาณ → เหรียญเซียน (พรีเมียม)
    var cc=10; if((g.gems||0)<cc){ setMsg("เพชรวิญญาณไม่พอ (ต้องใช้ 💎"+cc+")"); buildTab(); return; }
    var best=(g.dungeon&&g.dungeon.best)||1;
    var gm=(typeof gainMult==="function")?gainMult(g):1;
    var perKill=(1+best*0.6+Math.pow(best,1.05)*0.4)*gm;
    var camt=Math.max(2000,Math.floor(perKill*150)); // ~150 ครั้งของรายได้เหรียญ
    g.gems-=cc; g.coins+=camt;
    setMsg("แลก 💎"+cc+" → ❖"+fmt(camt));
  } else if(kind==="g2q"){ // เพชรวิญญาณ → พลังชี่ (พรีเมียม)
    var qc=10; if((g.gems||0)<qc){ setMsg("เพชรวิญญาณไม่พอ (ต้องใช้ 💎"+qc+")"); buildTab(); return; }
    var qr=(typeof baseQiSec==="function")?baseQiSec(g):1;
    var qamt=Math.max(100,Math.floor(qr*300)); // ~5 นาทีของรายได้ชี่
    g.gems-=qc; g.qi=Math.min((g.qi||0)+qamt, 9e15);
    setMsg("แลก 💎"+qc+" → ⚡"+fmt(qamt)+" พลังชี่");
  } else return;
  save(); renderHeader(); buildTab();
}

function buyGemItem(i){

// ---------- CLONE SYSTEM (อวตารเงา) ----------
function cloneCost(){ return Math.floor(110*Math.pow(1.5,g.clones.total)); }
function createClone(){
  var c=cloneCost();
  if(g.clones.total>=g.clones.max){ setMsg("ถึงขีดจำกัดอวตาร ทะลุด่าน/พิชิตหอคอยเพื่อเพิ่มขีดจำกัด"); buildTab(); return; }
  if(g.stones<c){ setMsg("หินวิญญาณไม่พอ"); buildTab(); return; }
  g.stones-=c; g.clones.total++; g.cloneSeq=(g.cloneSeq||0)+1;
  g.clones.list.push({id:g.cloneSeq,level:1,task:"meditate"});
  addLog("แยกร่างอวตารเงา #"+g.cloneSeq+" สำเร็จ","jade");
  save(); buildTab();
}
function assignTask(id,task){ var c=g.clones.list.find(function(x){return x.id===id;}); if(c)c.task=task; save(); buildTab(); }
function levelUpClone(id){
  var c=g.clones.list.find(function(x){return x.id===id;}); if(!c)return;
  if(c.level>=80){ setMsg("อวตารถึงเลเวลสูงสุดแล้ว"); buildTab(); return; }
  var cost=Math.floor(150*Math.pow(1.6,c.level));
  if(g.stones<cost){ setMsg("หินวิญญาณไม่พออัปเลเวลอวตาร"); buildTab(); return; }
  g.stones-=cost; c.level=Math.min(c.level+1,80); save(); buildTab();
}
function sendToFight(id){
  var c=g.clones.list.find(function(x){return x.id===id;}); if(!c||c.task!=="fight")return;
  if(c.level>=80)return;
  var death=Math.max(0.02,0.12-c.level*0.0015);
  if(Math.random()<death){
    g.clones.list=g.clones.list.filter(function(x){return x.id!==id;}); g.clones.total--;
    var rw=Math.floor((280+c.level*55)*gainMult(g)); g.stones+=rw;
    addLog("อวตาร #"+id+" (Lv."+c.level+") พลีร่างในสนามรบ ได้หินวิญญาณ "+fmt(rw),"bad");
  } else {
    g.stones+=Math.floor((110+c.level*22)*gainMult(g)); g.qi+=45+c.level*11; c.level=Math.min(c.level+1,80);
    addLog("อวตาร #"+id+" รอดชีวิตและแกร่งขึ้น","jade");
  }
  save(); buildTab();
}
function autoAssign(){
  var n=g.clones.list.length; if(!n)return;
  if(n<4){ g.clones.list.forEach(function(c,i){ c.task=["fight","train","gather","meditate"][i]; }); save(); buildTab(); return; }
  var per=Math.floor(n/4);
  g.clones.list.forEach(function(c,i){ c.task = i<per?"fight":i<per*2?"train":i<per*3?"gather":"meditate"; });
  save(); buildTab();
}

function checkMilestones(){
  if(!g.challenges)g.challenges={done:{}};
  for(var i=0;i<MILESTONES.length;i++){ var m=MILESTONES[i];
    if(!g.challenges.done[m.key]&&m.test()){ g.challenges.done[m.key]=true; m.grant(); addLog("สำเร็จความท้าทาย: "+m.name+" — รับ "+m.reward,"gold"); }
  }
}

var REBIRTH_REQ=4;
function rebirthGain(){ return g.ri<REBIRTH_REQ?0:Math.max(1,Math.floor((abs(g.ri,g.layer)-27)+Math.sqrt(Math.max(0,g.dungeon.best)))); }
function doRebirth(){
  var gain=rebirthGain(); if(gain<=0)return;
  var aw=(g.awaken||0)+gain,rb=(g.rebirth||0)+1,best=g.dungeon.best,bless=g.blessing,mul=g.buyMul,prevLog=g.log;
  var chal=JSON.parse(JSON.stringify(g.challenges||{done:{}})),cmax=g.clones.max||6,aeq=g.autoEquip,clseq=g.cloneSeq||0;
  var pet=g.pet;                       // เก็บคอลเลกชันสัตว์เลี้ยงไว้ข้ามการเกิดใหม่
  var gems=g.gems||0,gpity=g.gachaPity||0,topT=g.topupTotal||0;     // เพชรวิญญาณ + พิตี้กาชา + ยอดเติมสะสม ต้องรอดข้ามการเกิดใหม่
  var skins=g.skins?JSON.parse(JSON.stringify(g.skins)):null;    // สกินรัศมีที่ปลดล็อก/สวมอยู่ ต้องไม่หาย
  g=G0(); g.awaken=aw; g.rebirth=rb; g.dungeon.best=best; g.blessing=bless; g.buyMul=mul; g.tab="culti";
  g.challenges=chal; g.clones.max=cmax; g.autoEquip=aeq; g.cloneSeq=clseq; if(pet)g.pet=pet;
  g.gems=gems; g.gachaPity=gpity; g.topupTotal=topT; if(skins)g.skins=skins; g.hp=pHP(g);
  g.log=[{t:"เกิดใหม่ครั้งที่ "+rb+" ได้รับจิตเซียน "+gain+" ตัวคูณพลังรวมเป็น "+(1+0.05*aw).toFixed(2)+" เท่า",k:"gold"}].concat(prevLog).slice(0,60);
  save(); closeOverlay(); setTab("culti");
}

// export/import
function exportCode(){ return btoa(unescape(encodeURIComponent(envelope()))); }
function importCode(raw){ var json=decodeURIComponent(escape(atob(raw.trim()))); return parseSave(json); }
function doExport(){ try{ document.getElementById("expBox").value=exportCode(); setMsg("สร้างโค้ดแล้ว คัดลอกหรือดาวน์โหลดไฟล์ไปเก็บได้"); }catch(e){ setMsg("สร้างโค้ดไม่สำเร็จ"); } }
function doCopy(){ var v=document.getElementById("expBox").value||exportCode(); try{ navigator.clipboard.writeText(v); setMsg("คัดลอกโค้ดแล้ว นำไปวางในช่องโหลดของอีกเครื่องได้"); }catch(e){ setMsg("คัดลอกไม่ได้ ให้แตะค้างที่ช่องเพื่อคัดลอกเอง"); } }
function doImport(){ try{ var raw=document.getElementById("impBox").value.trim(); if(!raw){ setMsg("วางโค้ดก่อน"); return; } applyLoad(importCode(raw)); save(); setMsg("โหลดความคืบหน้าสำเร็จ"); lastRi=-1; renderHeader(); buildTabBar(); buildTab(); }catch(e){ setMsg("โค้ดไม่ถูกต้องหรือไฟล์เสียหาย"); } }
function manualSave(){ save(); setMsg("บันทึกความคืบหน้าแล้ว"); }
// ---- portable .save file: download current progress and load from a chosen file ----
function downloadSave(){
  try{
    var name="xian-save-"+(g.rebirth||0)+"r-"+REALMS[g.ri].n+"-"+new Date().toISOString().slice(0,10)+".save";
    var blob=new Blob([exportCode()],{type:"text/plain"});
    var url=URL.createObjectURL(blob); var a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
    setMsg("ดาวน์โหลดไฟล์เซฟแล้ว นำไปเปิดในอีกเครื่องได้");
  }catch(e){ setMsg("ดาวน์โหลดไม่สำเร็จ ใช้วิธีคัดลอกโค้ดแทน"); }
}
function loadSaveFile(){ var inp=document.getElementById("saveFile"); if(inp)inp.click(); }
function onSaveFile(e){
  var inp=e.target; var f=inp.files&&inp.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){ try{ var box=document.getElementById("impBox"); if(box)box.value=String(rd.result).trim(); doImport(); }catch(err){ setMsg("อ่านไฟล์ไม่สำเร็จ"); } inp.value=""; };
  rd.onerror=function(){ setMsg("อ่านไฟล์ไม่สำเร็จ"); inp.value=""; };
  rd.readAsText(f);
}

// radial particle burst (kill / boss-defeat juice)
function burst(areaId,color,n){
  var area=document.getElementById(areaId); if(!area)return; n=n||10;
  for(var i=0;i<n;i++){
    var p=document.createElement("span"); p.className="brst";
    var ang=Math.random()*6.283, dist=18+Math.random()*46;
    p.style.left="50%"; p.style.top="46%"; p.style.color=color; p.style.background=color;
    p.style.setProperty("--dx",(Math.cos(ang)*dist).toFixed(1)+"px");
    p.style.setProperty("--dy",(Math.sin(ang)*dist).toFixed(1)+"px");
    area.appendChild(p);
    (function(el){ setTimeout(function(){ if(el.parentNode)el.parentNode.removeChild(el); },760); })(p);
  }
}

function burstAttack(){
  if(Date.now()<(g.recoverUntil||0)) return false;            // กำลังพักฟื้น ใช้ไม่ได้
  var dmg=Math.max(1,Math.floor(pATK(g)*25));
  if(g.tab==="tower"){ var m=g.dungeon.mon; if(!m)return false; m.hp-=dmg; spawnFloat("dunArea",dmg,true); burst("dunArea","#ffd06a",18); if(m.hp<=0)dunKill(); }

  return true;
}

// ---- fixed-timestep simulation: one sim step = STEP seconds, independent of frame rate ----
var STEP=0.1, MAXCATCH=2.0, _accT=0, _last=0;
function simStep(){
  var dt=STEP;
  g.qi+=baseQiSec(g)*dt;
  g.stones+=stoneSec(g)*dt;
  g.playTime=(g.playTime||0)+dt;
  if(g.auto&&!isFinalG(g)&&g.qi>=qiNeed(g.ri,g.layer)){
    var top=g.layer>=REALMS[g.ri].sub;
    var ch=Math.min(0.95,0.68+gsum(g).culti*0.004);
    if(!top||g.protect>0||ch>=0.8) breakthrough(true);
  }
  if(!g.enc){ g.encTimer+=dt; if(g.encTimer>=g.encNext){ g.enc=pick(ENCOUNTERS); g.encTimer=0; g.encNext=rnd(70,120); showEncounter(); } }
  g.acc+=dt; while(g.acc>=0.5){ g.acc-=0.5; passiveCombat(); }
  // ฟื้นพลังชีวิตตามเวลา (เร็วมากตอนพักฟื้น, เร็วตอนพัก, ช้าตอนสู้)
  var mhp=pHP(g); if(g.hp==null)g.hp=mhp;
  var recovering=Date.now()<(g.recoverUntil||0);
  var regenRate=recovering?0.45:((g.tab==="hunt"||g.tab==="tower")?0.04:0.12);
  if(g.hp<mhp) g.hp=Math.min(mhp, g.hp+mhp*regenRate*dt);
  tick++;
  if(tick%10===0) checkMilestones();
  if(tick%120===0) ensureDaily();
}
function frame(now){
  if(!_last)_last=now;
  var elapsed=(now-_last)/1000; _last=now;
  if(elapsed>MAXCATCH)elapsed=MAXCATCH;     // cap catch-up after lag/tab-throttle
  _accT+=elapsed;
  var steps=0;
  while(_accT>=STEP && steps<64){ simStep(); _accT-=STEP; steps++; }
  updateLive();
  if(tick%3===0 && Date.now()-lastScroll>1100 && ["culti","char","gear","shop","topup","alch","skill","clones","challenges","pet","daily","gacha"].indexOf(g.tab)>=0){ if(tabSig()!==lastSig) buildTab(); }
  if(tick%30===0){ var asig=(anyHiddenAlert()?1:0)+"|"+NAVBAR.map(function(x){return tabAlert(x[0])?1:0;}).join(""); if(asig!==lastAlertSig){ lastAlertSig=asig; buildTabBar(); } }
  if(tick%50===0) save();
  requestAnimationFrame(frame);
}

  chest:function(a){openChestI(Number(a));}, bless:function(){buyBless();}, enc:function(a){encChoose(Number(a));},

var CHG={ auto:function(c){toggleAuto(c);}, autoEquip:function(c){setAutoEquip(c);} };
function onClick(e){ var t=e.target; while(t&&t.getAttribute&&t.getAttribute("data-act")==null)t=t.parentNode; if(!t||!t.getAttribute)return; var act=t.getAttribute("data-act"); var f=act!=null&&ACT[act]; if(f){ e.preventDefault(); f(t.getAttribute("data-a"),t.getAttribute("data-b")); } }
function onChange(e){ var t=e.target; if(!t||!t.getAttribute)return; if(t.id==="saveFile"){ onSaveFile(e); return; } var chg=t.getAttribute("data-chg"); var f=chg!=null&&CHG[chg]; if(f&&(t.type==="checkbox"||t.type==="radio"))f(!!t.checked); }

// ==================== INIT ====================
function init(){
  load();
  if(g.enc)g.enc=null;
  ensureDaily();
  buildShell();
  renderHeader();
  buildTab();
  updateLive();
  document.addEventListener("click",onClick);
  document.addEventListener("change",onChange);
  if(offlineReport) showOffline();
  tryCloudLoad();
  requestAnimationFrame(frame);
  window.addEventListener("beforeunload",save);
  window.addEventListener("pagehide",save);
  document.addEventListener("visibilitychange",function(){ if(document.hidden){ save(); _last=0; } });
  document.addEventListener("keydown",function(e){ var tag=(e.target.tagName||"").toLowerCase(); if(e.key===" "&&tag!=="textarea"&&tag!=="input"){ e.preventDefault(); g.tab==="tower"?tapDungeon():tapMob(); } });
}
window.onload=init;
